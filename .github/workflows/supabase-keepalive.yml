# Keeps the RuneScape TCG's free Supabase project awake. Supabase pauses free projects after a week with no
# activity, which would switch online play off. This reads one row twice a week. Remove it once the project
# is on the Pro plan (Pro projects are never paused).
#
# GitHub only runs scheduled workflows from the repository's default branch, so this file has to be there.
# The key below is the project's publishable key: it is meant to be public (the game ships it too) and can
# only read the keepalive row.
name: Supabase keep-alive (RuneScape TCG)

on:
  schedule:
    - cron: '17 14 * * 1,4'   # Mondays and Thursdays, 14:17 UTC
  workflow_dispatch:          # and a "Run workflow" button, to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the keepalive row
        run: |
          curl --fail --silent --show-error \
            -H "apikey: sb_publishable_eaN07rbCUAT_-FtdXkB2Iw_IjdGi_bJ" \
            "https://udmaqoxyhiwpvxkrugwr.supabase.co/rest/v1/keepalive?select=id"
