<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RuneScape TCG Arena</title>
<style>/*__FONTS__*/</style>
<style>
/* RuneScape TCG — Arena client, step 1: the board drawn from engine state.
   Everything sits on a fixed 1920x1080 stage that is scaled to fit the window (like a game, not a web page).
   Card faces match print/build_pnp.py so paper and screen read as one game. */
:root {
  --gold: #c9a54b; --gold-hi: #f3d27a; --gold-pale: #fff1c4; --parch: #f1e7cf; --ink: #2a2420; --cream: #e9dfc7; --muted: #cdbf9f; --faint: #8f8268;
  --melee: #8e2b23; --ranged: #3e6b34; --magic: #2d4f8c; --neutral: #5e5a52; --material: #7a6648; --cape: #b08a2e;
  --you: #c9a54b; --bot: #2d4f8c; --bot-hi: #9cc3e6; --hurt: #ff9b85; --heal: #9fd986;
  --display: 'Cinzel', Georgia, serif; --body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0a0806; overflow: hidden; }
body { font-family: var(--body); color: var(--cream); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold-pale); outline-offset: 2px; }
/* overflow: clip, not hidden: a hidden box can still be scrolled by focus or scrollIntoView, which shifts the stage */
#viewport { position: fixed; inset: 0; overflow: clip; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: clip; }
#board { position: absolute; inset: 0; overflow: clip; }
.abs { position: absolute; }

/* ---------- table ---------- */
.table { position: absolute; inset: 0; background-color: #15110d;
  background-image: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 35%, rgba(0,0,0,.6) 100%),
    repeating-linear-gradient(45deg, rgba(201,165,75,.035) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(-45deg, rgba(201,165,75,.035) 0 1px, transparent 1px 22px); }
.backdrop { position: absolute; left: -60px; top: -60px; width: calc(100% + 120px); height: calc(100% + 120px); object-fit: cover; object-position: 50% 30%;
  filter: blur(9px) brightness(.42) saturate(.9); }
.backdrop-veil { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, rgba(12,9,7,.15) 30%, rgba(12,9,7,.78) 100%); }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.mat { position: absolute; left: 60px; width: 1560px; height: 236px; padding: 14px 18px; display: flex; gap: 18px; border-radius: 16px;
  background-color: #2a211a; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px);
  border: 1.5px solid rgba(201,165,75,.35); box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.5); }
.mat.active-you { border: 2px solid #e9c86a; box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 0 0 4px rgba(243,210,122,.10), 0 0 30px rgba(243,210,122,.22); }
.mat.active-bot { border: 2px solid var(--bot-hi); box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 0 0 4px rgba(156,195,230,.10), 0 0 30px rgba(156,195,230,.25); }
.strip { position: absolute; left: 48px; top: 362px; width: 1584px; height: 200px; background: rgba(15,12,9,.72);
  border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold);
  box-shadow: inset 0 4px 0 -2px rgba(201,165,75,.35), inset 0 -4px 0 -2px rgba(201,165,75,.35), 0 0 30px rgba(0,0,0,.6); }
.lbl { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.ttl { font-family: var(--display); font-weight: 700; color: var(--gold-hi); line-height: 1; }
.who { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 20px; padding: 0 6px; border-radius: 4px;
  font-size: 11px; font-weight: 700; letter-spacing: .1em; }
.who.you { background: var(--you); color: #1a1410; } .who.bot { background: var(--bot); color: #e3f0fa; }

/* ---------- CardFace (print look) ---------- */
.cf { width: 375px; height: 525px; padding: 10px; background: var(--frame); border-radius: 14px; font-family: var(--body); color: #241f1a; }
.cf-in { height: 100%; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; background: var(--parch); border: 1px solid rgba(0,0,0,.4); }
.cf-hd { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--ink); flex: none; }
.ci { width: 44px; height: 44px; border-radius: 50%; background: var(--parch); border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; }
.ci img { width: 30px; height: 30px; object-fit: contain; }
.ci b { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--ink); }
.cf-tt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cf-nm { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--gold-hi); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cf-sb { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.art { height: 200px; flex: none; display: flex; align-items: center; justify-content: center; background: #3b342d;
  border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); padding: 14px; position: relative; overflow: hidden; }
.art img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
.art.full { padding: 0; }
.art.full img.scene { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; filter: none; }
.art.full img.portrait { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; object-position: 50% 12%; filter: none; }
.art.full img.bg { position: absolute; inset: -20px; width: calc(100% + 40px); height: calc(100% + 40px); max-width: none; max-height: none; object-fit: cover; filter: blur(14px) brightness(.7); }
.art.full img.fg { position: relative; height: 100%; width: auto; max-width: none; max-height: none; filter: drop-shadow(0 0 8px rgba(0,0,0,.6)); }
.art img.px { width: 120px; height: 120px; image-rendering: pixelated; }
.ph { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.ph img { width: 80px; height: 80px; object-fit: contain; opacity: .22; filter: grayscale(.3); }
.ph i { font-style: normal; font-size: 60px; color: var(--gold); opacity: .35; line-height: 1; }
.ph span { font-family: var(--display); font-weight: 700; font-size: 22px; color: #8f8268; }
.ph small { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #7d715a; }
.cf-strip { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: var(--ink); color: var(--cream); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; flex: none; }
.cf-bd { flex: 1; padding: 10px 14px 4px; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
.cf-bd p { margin: 0; font-size: 15px; line-height: 1.3; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 9px; border-radius: 6px; background: #e3d5b5; border: 1px solid #b9a982; font-family: var(--display); font-weight: 700; font-size: 16px; }
.cf-ft { display: flex; justify-content: space-between; padding: 5px 12px 7px; font-size: 11px; color: #5a4e40; letter-spacing: .04em; flex: none; }
.sc { position: absolute; transform-origin: 0 0; }

/* ---------- the tilted table ---------- */
.scene { position: absolute; inset: 0; pointer-events: none; }
.plane { position: absolute; left: 0; width: 1920px; height: 780px; transform-origin: 50% 100%; pointer-events: auto; }
.felt { position: absolute; inset: -6px 0 0; border-radius: 36px; background: radial-gradient(ellipse at 50% 70%, rgba(58,44,32,.92) 0%, rgba(36,26,18,.92) 60%, rgba(22,15,10,.94) 100%);
  box-shadow: inset 0 0 0 6px #5a4126, inset 0 0 0 10px #2a1d12, inset 0 0 140px rgba(0,0,0,.7), 0 30px 60px rgba(0,0,0,.6); }
.plane .mat { left: 16px; width: 1568px; height: 250px; padding: 12px 16px; gap: 16px; }
.col1 { width: 336px; flex: none; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.np { display: flex; align-items: center; gap: 12px; }
.np-pic { position: relative; width: 74px; height: 74px; flex: none; border-radius: 50%; background: var(--parch); border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; }
.np-pic > img:first-child { width: 46px; height: 46px; object-fit: contain; }
.np-nm { font-family: var(--display); font-weight: 700; font-size: 30px; color: var(--gold-hi); line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.npc { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 12px; background: rgba(0,0,0,.35); border: 1px solid rgba(201,165,75,.4); font-weight: 800; font-size: 17px; }
.npc img { width: 18px; height: 18px; }
.mchips { display: flex; flex-wrap: wrap; gap: 10px 12px; align-content: flex-start; min-height: 60px; }
.mchips .none { color: var(--faint); font-size: 17px; padding-top: 14px; }
.mchip { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 52px; padding: 0 14px 0 6px; border-radius: 26px; background: #1a1410; border: 2px solid rgba(201,165,75,.6); box-shadow: 0 6px 8px rgba(0,0,0,.45); }
.mchip img, .mchip svg { width: 42px; height: 42px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
.mchip b { font-family: var(--display); font-weight: 700; font-size: 28px; color: var(--cream); line-height: 1; }
.mchip small { font-size: 13px; font-weight: 800; color: var(--bot-hi); margin-left: 4px; }
.mchip.ghost { border: 2px dashed var(--bot-hi); background: transparent; opacity: .75; }
.mchip .mt-g { left: auto; right: -8px; top: -12px; }
.slots { display: flex; gap: 10px; }
.plane .sl { width: 146px; gap: 5px; }
.plane .sl > .mc, .plane .sl > .sl-em { zoom: 1.3; }
.plane .sl-em { font-size: 12px; font-weight: 800; }
.plane .pp { height: 14px; }
.qstep { display: block; max-width: 100px; overflow: hidden; text-overflow: ellipsis; font-size: 10px; }
.energy { width: 196px; flex: none; display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.energy .lbl { font-size: 15px; }
.energy .fx-b { font-size: 15px; }
.strip { position: absolute; left: 16px; top: 272px; width: 1888px; height: 236px; border-radius: 18px; background: rgba(15,12,9,.62);
  border: 2px solid rgba(201,165,75,.55); box-shadow: inset 0 0 30px rgba(0,0,0,.5); }
.capew { position: absolute; }
.capew > .capet { position: relative; top: 0; left: 0; width: 600px; zoom: 1.2; }
.locw { position: absolute; left: 776px; width: 368px; height: 207px; }
.locw > .abs { zoom: 1.15; }
.turnp { width: 392px; height: 100px; padding: 12px 18px; border-radius: 14px; border: 2px solid; display: flex; flex-direction: column; justify-content: space-between; }
.acts { display: grid; grid-template-columns: repeat(2, 140px); gap: 10px; zoom: 1.3; }
.bhn { position: absolute; min-width: 46px; height: 46px; padding: 0 10px; border-radius: 23px; background: #17202a; border: 2px solid var(--bot-hi); color: #e3f0fa;
  font-family: var(--display); font-weight: 700; font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 12px rgba(0,0,0,.6); }

/* ---------- the tutorial guide and tips ---------- */
.coach { position: absolute; left: 510px; top: 14px; z-index: 70; width: 900px; display: flex; gap: 18px; padding: 16px 20px; border-radius: 18px;
  background: rgba(24,18,14,.97); border: 2px solid var(--gold-hi); box-shadow: 0 0 0 5px rgba(243,210,122,.14), 0 16px 40px rgba(0,0,0,.8); }
.coach.fresh { animation: zin .2s ease-out; }
.coach.tip { left: 610px; width: 700px; border-color: rgba(201,165,75,.7); background: rgba(24,18,14,.95); }
.coach-pic { width: 88px; height: 88px; flex: none; border-radius: 50%; background: radial-gradient(circle, #3b2c1c, #120d09); border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; }
.coach-pic img { width: 78px; height: 78px; }
.coach-body { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.coach-top { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 800; letter-spacing: .2em; color: var(--muted); }
.coach-body > b { font-family: var(--display); font-weight: 700; font-size: 34px; color: var(--gold-hi); line-height: 1.1; }
.coach-body > p { margin: 0; font-size: 25px; line-height: 1.4; color: var(--cream); }
.coach .tut-next { align-self: flex-end; height: 56px; padding: 0 34px; font-size: 22px; }
.coach-do { align-self: flex-end; font-size: 16px; font-weight: 800; letter-spacing: .2em; color: var(--gold-hi); text-transform: uppercase; animation: twinkle 1.6s ease-in-out infinite; }
.coach-skip { background: none; border: 0; padding: 4px 6px; font-size: 14px; font-weight: 800; letter-spacing: .1em; color: var(--faint); text-decoration: underline; cursor: pointer; }
.tut-hi { outline: 4px solid #ffd76a; outline-offset: 5px; border-radius: 12px; animation: tutpulse 1.2s ease-in-out infinite; }
@keyframes tutpulse { 50% { outline-color: rgba(255,215,106,.35); outline-offset: 10px; } }
.mi .side.free { background: #17240f; border: 1.5px solid #79c25a; color: #b9e3a5; }
.ptut { left: calc(50% - 430px); top: 20px; width: 860px; }

/* ---------- HandCard ---------- */
.hc { position: absolute; width: 230px; height: 322px; border-radius: 8px; transform-origin: 50% 100%; transition: transform .15s ease-out, top .15s ease-out, box-shadow .15s; }
.hc > .cf { transform: scale(.61333); transform-origin: 0 0; }
.hc.ok { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 16px 3px rgba(243,210,122,.55), 0 12px 22px rgba(0,0,0,.65); animation: pulse 1.6s ease-in-out infinite; cursor: pointer; }
.hc.no { box-shadow: 0 12px 22px rgba(0,0,0,.65); cursor: help; }
.hc.no > .cf { filter: brightness(.5) saturate(.4); }
.hc.sel { box-shadow: 0 0 0 3px var(--gold-pale), 0 0 28px 8px rgba(243,210,122,.8), 0 22px 34px rgba(0,0,0,.75); animation: none; }
.hc.react { box-shadow: 0 0 0 3px #9fd986, 0 0 30px 10px rgba(121,194,90,.55), 0 24px 34px rgba(0,0,0,.75); cursor: pointer; }
.hc.toss { box-shadow: 0 0 0 3px var(--hurt), 0 0 22px 6px rgba(255,90,60,.5), 0 12px 22px rgba(0,0,0,.65); cursor: pointer; }
.hc:not(.sel):not(.react):hover { transform: translateY(-14px) !important; z-index: 29 !important; }
@keyframes pulse { 50% { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 24px 6px rgba(243,210,122,.7), 0 12px 22px rgba(0,0,0,.65); } }
.bk { position: absolute; border-radius: 7px; overflow: hidden; }
.bk img { display: block; width: 100%; height: 100%; }

/* ---------- InPlayCard (compact) ---------- */
.mc { position: relative; width: 112px; height: 156px; padding: 4px; border-radius: 7px; background: var(--frame); box-shadow: 0 6px 14px rgba(0,0,0,.55); }
.mc-in { height: 100%; border-radius: 4px; overflow: hidden; background: var(--parch); display: flex; flex-direction: column; }
.mc-nm { background: var(--ink); color: var(--gold-hi); font-family: var(--display); font-weight: 700; font-size: 11px; line-height: 1.15; padding: 5px 6px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
.mc-art { flex: 1; min-height: 0; background: #3b342d; border-top: 1.5px solid var(--gold); border-bottom: 1.5px solid var(--gold); display: flex; align-items: center; justify-content: center; padding: 6px; position: relative; overflow: hidden; }
.mc-art img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
.mc-art img.px { width: 54px; height: 54px; image-rendering: pixelated; }
.mc-art img.cover { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; filter: none; }
.mc-art img.ghost { width: 46px; height: 46px; opacity: .22; filter: grayscale(.3); }
.mc-art i { font-style: normal; font-size: 34px; color: var(--gold); opacity: .35; }
.mc-ft { height: 30px; flex: none; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0 4px; font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.mc-ft img { width: 14px; height: 14px; object-fit: contain; }
.key { position: absolute; right: -11px; top: -11px; min-width: 42px; height: 42px; padding: 0 4px; border-radius: 21px; background: var(--parch); border: 3px solid var(--gold);
  display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.7); }
.ac { display: flex; align-items: center; gap: 1px; font-family: var(--body); font-weight: 700; font-size: 12px; }
.ac img { width: 13px; height: 13px; }
.notyet { position: absolute; left: 6px; right: 6px; top: 64px; padding: 2px 0; border-radius: 4px; background: rgba(26,20,16,.9); border: 1.5px solid var(--gold-hi);
  text-align: center; font-family: var(--display); font-weight: 700; font-size: 10px; letter-spacing: .08em; color: var(--gold-hi); }

/* ---------- EquipSlot ---------- */
.sl { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 118px; }
.sl-lb { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); height: 14px; }
.sl-em { width: 112px; height: 156px; border: 1.5px dashed rgba(201,165,75,.38); border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  background: rgba(0,0,0,.2); color: rgba(201,165,75,.5); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.pp { display: flex; gap: 4px; height: 12px; align-items: center; }
.p1, .p0 { display: block; width: 14px; height: 8px; border-radius: 2px; }
.p1 { background: var(--gold-hi); box-shadow: 0 0 6px rgba(243,210,122,.6); }
.p0 { border: 1px solid rgba(201,165,75,.5); }
.pp.soak .p1 { width: 9px; background: var(--bot-hi); box-shadow: 0 0 5px rgba(156,195,230,.6); }
.pp.soak .p0 { width: 9px; border-color: rgba(156,195,230,.45); }
.pp.round .p1, .pp.round .p0 { width: 10px; height: 10px; border-radius: 50%; }
.inf { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--gold-hi); line-height: 1; }

/* ---------- MaterialStack ---------- */
.fam { display: flex; flex-direction: column; gap: 8px; padding: 8px 12px 10px; border-radius: 10px; background: rgba(0,0,0,.24); border: 1px solid rgba(201,165,75,.25); }
.fam-hd { display: flex; align-items: baseline; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.fam-hd b { font-family: var(--display); font-size: 24px; letter-spacing: 0; color: var(--gold-hi); line-height: 1; }
.ghostn { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 9px; border: 1.5px dashed var(--bot-hi); color: var(--bot-hi); font-size: 12px; letter-spacing: .02em; }
.mts { display: flex; gap: 20px; padding: 10px 10px 6px 0; }
.mt { position: relative; width: 64px; height: 90px; padding: 3px; border-radius: 6px; background: var(--material); }
.mt-in { height: 100%; border-radius: 3px; background: #3b342d; display: flex; flex-direction: column; overflow: hidden; }
.mt-art { flex: 1; display: flex; align-items: center; justify-content: center; }
.mt-art img { width: 50px; height: 44px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
.mt-nm { flex: none; background: var(--parch); color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 9.5px; text-align: center; padding: 3px 0 2px; white-space: nowrap; overflow: hidden; }
.mt-n { position: absolute; right: -10px; bottom: -10px; min-width: 30px; height: 30px; padding: 0 4px; border-radius: 15px; background: var(--ink); border: 2.5px solid var(--gold);
  display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--gold-hi); box-shadow: 0 2px 6px rgba(0,0,0,.7); }
.mt-n small { font-size: 10px; margin-right: 1px; color: var(--muted); }
.mt-g { position: absolute; left: -10px; top: -14px; padding: 1px 6px; border-radius: 9px; background: #17202a; border: 1.5px dashed var(--bot-hi); color: var(--bot-hi); font-family: var(--display); font-weight: 700; font-size: 12px; }
.l2 { box-shadow: 3px -3px 0 -1px #5b4c35, 3px -3px 0 0 #120e0b, 0 6px 12px rgba(0,0,0,.5); }
.l3 { box-shadow: 3px -3px 0 -1px #5b4c35, 3px -3px 0 0 #120e0b, 6px -6px 0 -1px #5b4c35, 6px -6px 0 0 #120e0b, 0 6px 12px rgba(0,0,0,.5); }
.l4 { box-shadow: 3px -3px 0 -1px #5b4c35, 3px -3px 0 0 #120e0b, 6px -6px 0 -1px #5b4c35, 6px -6px 0 0 #120e0b, 9px -9px 0 -1px #5b4c35, 9px -9px 0 0 #120e0b, 0 6px 12px rgba(0,0,0,.5); }
.l1 { box-shadow: 0 6px 12px rgba(0,0,0,.5); }
.nofam { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 12px; border: 1px dashed rgba(201,165,75,.3); color: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }

.ab { display: flex; align-items: center; gap: 8px; width: 140px; height: 54px; padding: 0 10px; border-radius: 9px; border: 1.5px solid var(--gold); background: #2b221b; color: var(--parch);

  background: radial-gradient(ellipse at 50% 30%, #b5532f 0%, #7a2618 70%, #4d150d 100%); color: #fff3d1; font-family: var(--display); font-weight: 700; font-size: 40px; letter-spacing: .06em;

/* ---------- popovers, prompts, overlays ---------- */

.panel { background: #1d1713; border: 1px solid rgba(201,165,75,.45); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.btn-g { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 12px; border: 2.5px solid var(--gold-hi);
  background: radial-gradient(ellipse at 50% 30%, #b5532f 0%, #7a2618 70%, #4d150d 100%); color: #fff3d1; font-family: var(--display); font-weight: 700; letter-spacing: .06em;
  box-shadow: inset 0 0 0 2px #4d150d, inset 0 0 0 4px rgba(243,210,122,.5), 0 0 26px rgba(243,140,60,.35), 0 8px 18px rgba(0,0,0,.6); text-shadow: 0 2px 4px rgba(0,0,0,.6); }

#zoom { position: absolute; z-index: 100; pointer-events: none; filter: drop-shadow(0 20px 40px rgba(0,0,0,.8)); display: none; }
#zoom.on { display: block; animation: zin .12s ease-out; }
/* holding a phone upright: ask for landscape (html.portrait is set in stageFor) */
#rotate { display: none; position: fixed; inset: 0; z-index: 1000; background: radial-gradient(ellipse at 50% 40%, #2a2017 0%, #0a0806 75%);
  flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 30px; text-align: center; color: var(--cream); font-family: var(--body); }

#zoom.big { transform-origin: 0 0; box-shadow: 0 0 0 3000px rgba(8,6,4,.6); border-radius: 18px; animation: none; }
/* fingers: hand cards and collection cards are dragged, never scrolled or pinched; nothing offers the browser's long-press menu */
.hc, .cc { touch-action: none; }

@keyframes zin { from { transform: scale(.85); opacity: 0; } }

.float.cape { color: var(--gold-hi); } .float.capebot { color: var(--bot-hi); }
.float.hurt { color: var(--hurt); } .float.heal { color: var(--heal); } .float.soak { color: var(--bot-hi); font-size: 30px; }

.logtab { position: absolute; left: 1766px; top: 22px; width: 58px; height: 58px; padding: 0; border: 1.5px solid var(--gold); border-radius: 12px; background: #241c16;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 14px rgba(0,0,0,.6); z-index: 40; }

/* ---------- drag and drop ---------- */
.hc.ok, .hc.react, .hc.toss { touch-action: none; }

  box-shadow: 0 0 0 3px var(--gold-pale), 0 0 26px 6px rgba(243,210,122,.55), 30px 44px 40px rgba(0,0,0,.7); }

.dragging [data-zone].dz-on { outline: 2.5px dashed var(--gold-hi); outline-offset: 5px; border-radius: 12px; box-shadow: 0 0 26px rgba(243,210,122,.32); }

.ps-r { position: absolute; left: 30px; right: 30px; bottom: 0; height: 5px; border-radius: 3px; background: var(--rar); }
.calm .po, .calm .po-halo, .calm .pk-sheen, .calm .po-dim { animation: none !important; }

/* ---------- animations from the engine: flights, hits, heals, banners ---------- */
.fly { position: absolute; left: 0; top: 0; width: 375px; height: 525px; transform-origin: 0 0; pointer-events: none; will-change: transform, opacity; filter: drop-shadow(0 16px 20px rgba(0,0,0,.55)); }
.fly.flip { perspective: 1600px; }
.fly-in { position: relative; width: 375px; height: 525px; transform-style: preserve-3d; }
.fly .fs { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.fly .fs.bf { transform: rotateY(180deg); }
.fly img.cb { display: block; width: 375px; height: 525px; border-radius: 14px; }
.proj { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform, opacity; }
.orb { width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: radial-gradient(circle, #fff 0 16%, #b9d8ff 32%, #4f86d9 55%, rgba(45,79,140,0) 72%); box-shadow: 0 0 38px 14px rgba(110,160,255,.5); }
.spark { width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--c, #9cc3e6) 45%, transparent 70%); }
.arrowp { width: 120px; height: 18px; margin: -9px 0 0 -120px; transform-origin: 120px 9px; filter: drop-shadow(0 0 8px rgba(159,217,134,.8)); }
.fistp { width: 90px; height: 90px; margin: -45px 0 0 -45px; object-fit: contain; filter: drop-shadow(0 0 14px rgba(255,155,133,.8)); }
.slashp { width: 180px; height: 180px; margin: -90px 0 0 -90px; overflow: visible; }
.slashp path { stroke-dasharray: 170; stroke-dashoffset: 170; animation: slash .2s ease-out forwards; }
.slashp path:nth-child(2) { animation-delay: .05s; } .slashp path:nth-child(3) { animation-delay: .1s; }
@keyframes slash { to { stroke-dashoffset: 0; } }
.ring { width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; border: 4px solid var(--c, #ff9b85); box-shadow: 0 0 22px var(--c, #ff9b85), inset 0 0 14px var(--c, #ff9b85); }
.stamp { position: absolute; font-family: var(--display); font-weight: 700; letter-spacing: .08em; white-space: nowrap; pointer-events: none; color: var(--c, var(--gold-hi)); text-shadow: 0 3px 0 rgba(0,0,0,.75), 0 0 22px var(--c, var(--gold-hi)); }
.turnban { position: absolute; left: 0; right: 0; top: 400px; height: 124px; display: flex; align-items: center; justify-content: center; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(20,15,11,.94) 24%, rgba(20,15,11,.94) 76%, transparent); border-top: 2px solid var(--c); border-bottom: 2px solid var(--c); }
.turnban span { font-family: var(--display); font-weight: 700; font-size: 66px; color: var(--c); letter-spacing: .12em; text-shadow: 0 0 26px var(--g); }
.bigban { position: absolute; left: 0; right: 0; top: 250px; padding: 28px 0 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(20,15,11,.95) 24%, rgba(20,15,11,.95) 76%, transparent); border-top: 2px solid var(--c); border-bottom: 2px solid var(--c); }
.bigban img { height: 190px; filter: drop-shadow(0 0 30px rgba(243,210,122,.75)); }
.bigban b { font-family: var(--display); font-size: 54px; color: var(--c); text-shadow: 0 3px 0 rgba(0,0,0,.75), 0 0 26px var(--g); }
.bigban small { font-size: 20px; color: var(--cream); font-weight: 700; letter-spacing: .18em; text-shadow: 0 2px 0 rgba(0,0,0,.8); }

/* ---------- the bot showing its move before it happens ---------- */
#reveal { position: absolute; inset: 0; z-index: 85; pointer-events: none; }
.rv-card { position: absolute; left: 848px; top: 150px; width: 225px; height: 315px; filter: drop-shadow(0 0 24px rgba(156,195,230,.65)) drop-shadow(0 20px 30px rgba(0,0,0,.8)); animation: rvIn .25s cubic-bezier(.2,.8,.3,1.2) both; }
.rv-card > .cf { transform: scale(.6); transform-origin: 0 0; }
.rv-lbl { position: absolute; left: 0; right: 0; display: flex; justify-content: center; animation: rvIn .25s ease-out both; }
.rv-lbl span { display: inline-flex; align-items: center; gap: 10px; padding: 8px 20px 8px 10px; border-radius: 30px; background: #17202a; border: 2px solid var(--bot-hi);
  font-family: var(--display); font-weight: 700; font-size: 22px; color: #e3f0fa; box-shadow: 0 0 24px rgba(156,195,230,.45), 0 10px 20px rgba(0,0,0,.7); }
.rv-lbl img { width: 32px; height: 32px; object-fit: contain; }
.rv-lbl .who { min-width: 44px; height: 24px; font-family: var(--body); font-size: 12px; }
@keyframes rvIn { from { opacity: 0; transform: translateY(-16px) scale(.92); } }
.thinking i { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--bot-hi); animation: think 1.2s ease-in-out infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes think { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }

/* ---------- duel intro: decks appear, hands are dealt, the board builds, capes flip, then play ---------- */
.iw { will-change: transform, opacity; }
.iw.rise { animation: iwRise .6s cubic-bezier(.2,.8,.3,1) var(--d) both; }
.iw.drop { animation: iwDrop .6s cubic-bezier(.2,.8,.3,1) var(--d) both; }
.iw.fade { animation: iwFade .5s ease-out var(--d) both; }
.iw.deck { animation: iwDeck .55s cubic-bezier(.2,.8,.3,1.25) var(--d) both; }
@keyframes iwRise { from { opacity: 0; transform: translateY(70px); } }
@keyframes iwDrop { from { opacity: 0; transform: translateY(-70px); } }
@keyframes iwFade { from { opacity: 0; } }
@keyframes iwDeck { from { opacity: 0; transform: translateY(-40px) scale(1.2); } }
.hc.deal { animation: deal .55s cubic-bezier(.2,.8,.3,1) var(--d) both, dealin 0s linear var(--d) both; }
@keyframes dealin { from { visibility: hidden; } to { visibility: visible; } }   /* unseen until its deal starts, not parked on the deck */
@keyframes deal { from { transform: translate(var(--dx), var(--dy)) rotate(-6deg) scale(.58); } to { transform: rotate(var(--rot)); } }
.bk.deal { animation: dealb .5s cubic-bezier(.2,.8,.3,1) var(--d) both, dealin 0s linear var(--d) both; }
@keyframes dealb { from { transform: translate(var(--dx), var(--dy)) rotate(0deg) scale(1.14); } to { transform: rotate(var(--rot)); } }
.dealback { position: absolute; left: 0; top: 0; width: 190px; height: 266px; border-radius: 7px; z-index: 2; animation: flipaway .22s ease-in var(--d2) both; }
.capeback { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 7px; z-index: 3; animation: flipaway .3s ease-in var(--d) both; }
@keyframes flipaway { to { transform: scaleX(0); } }
.intro-title { position: absolute; left: 0; right: 0; top: 400px; z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 16px; pointer-events: none; animation: ititle 1.5s ease-out both; }
@keyframes ititle { 0% { opacity: 0; transform: scale(.9); } 20% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1.04); } }
.intro-first { position: absolute; left: 0; right: 0; top: 380px; z-index: 70; display: flex; justify-content: center; pointer-events: none; animation: ifirst 1.5s ease-out var(--d) both; }
.intro-first span { padding: 18px 60px; border-radius: 16px; background: rgba(20,15,11,.92); border: 3px solid var(--c); font-family: var(--display); font-weight: 700; font-size: 64px; color: var(--c); letter-spacing: .06em;
  box-shadow: 0 0 0 6px rgba(0,0,0,.3), 0 0 50px var(--g), 0 20px 40px rgba(0,0,0,.8); text-shadow: 0 0 24px var(--g); }
@keyframes ifirst { 0% { opacity: 0; transform: scale(1.3); } 15% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.skip { position: absolute; left: 1440px; top: 30px; z-index: 80; height: 44px; padding: 0 18px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) {
  .iw, .hc.deal, .bk.deal, .dealback, .capeback, .hc.ok, .rv-card, .rv-lbl, .thinking i { animation: none !important; }
  .dealback, .capeback { display: none; }
}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="board"></div><div id="reveal"></div><div id="fx"></div><div id="zoom"></div><div id="drag"></div></div></div>
<div id="rotate" role="alert"><img alt=""><svg class="rot-phone" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true"><rect x="38" y="14" width="44" height="92" rx="8" fill="#1a1410" stroke="#f3d27a" stroke-width="4"/><circle cx="60" cy="96" r="3.5" fill="#f3d27a"/></svg>
  <b>Turn your phone sideways</b><span>The Arena is played in landscape.</span></div>
<script>/*__DATA__*/</script>
<script>/*__ASSETS__*/</script>
<script>/*__ENGINE__*/</script>
<script>/*__BOT__*/</script>
<script>/*__ENGINESYNC__*/</script>
<script>/*__BOTLEVELS__*/</script>
<script>/*__AUDIO__*/</script>
<script>/*__WIZ__*/</script>
<script>/*__DECKRULES__*/</script>
<script>
(function () {
  'use strict';
  const R = window.RSTCG;
  R.setData(window.RSTCG_DATA);
  const { CARDS, CAPES, DECKS } = R;
  const { HeuristicBot } = window.RSTCGBot;
  const LV = window.RSTCGLevels;
  const AS = window.ARENA_ASSETS;
  const ART = AS.art, ICON = AS.icons, SET1 = AS.set1, FRAME = AS.frame;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const STORE = 'rstcg-arena-duel-v1';
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } },
  };

  // =====================================================================================
  // Card words. Copied from game.src.html so both pages describe cards the same way.
  // =====================================================================================
  const S = { melee: 'Melee', ranged: 'Ranged', magic: 'Magic', none: 'pure' };
  const FAM = { rune: 'rune', bar: 'bar', log: 'log', cloth: 'cloth', leather: 'leather', any: 'material' };
  const TIER = { 1: 'Bronze', 2: 'Mithril', 3: 'Rune' };
  const short = (m) => (m === 'Elemental Rune' ? 'Air/Water/Earth/Fire' : m.replace(/ (Bar|Rune|Logs)$/, ''));
  const countsText = (m, k) => (m === 'Elemental Rune'
    ? `Counts as ${k} of the Air, Water, Earth or Fire rune you have the most of in play.` : `Counts as ${k} ${m}s.`);
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const an = (w) => (/^[aeiou]/i.test(w) ? `an ${w}` : `a ${w}`);
  const deckObj = (name) => DECKS.find((d) => d.name === name);
  function reqText(c) {
    const parts = c.req.map(([m, k]) => `${k} ${short(m)}`);
    for (const [f, k] of c.fam_req) parts.push(`${plural(k, FAM[f])} in play`);
    if (c.families) parts.push(`${c.families} material types`);
    return parts.join(' + ');
  }
  function specText(c) {
    const free = R.FREE_SPECS.has(c.spec) ? ', free' : '';
    return {
      war_god: `Favour of the War God (${c.spec_cost}): swing and end their prayer`,
      sanctuary: `Sanctuary (${c.spec_cost}${free}): attacks against you deal ${c.spec_val} less until your next turn`,
      sunder: `Sunder (${c.spec_cost}): swing +${c.spec_val}; their shield breaks`,
      snapshot: `Snapshot (${c.spec_cost}): 2 shots in one action`,
      soulshot: `Soulshot (${c.spec_cost}): a shot +${c.spec_val} that ignores armor and reactions`,
      light: `Power of Light (${c.spec_cost}${free}): Melee damage you take is halved until your next turn`,
      iban: `Iban Blast (${c.spec_cost}): ${c.spec_val} Magic damage`,
      lightning: `Saradomin's Lightning (${c.spec_cost}): swing, then ${c.spec_val} Magic damage`,
    }[c.spec] || '';
  }
  const SPEC_NAME = { war_god: 'Favour of the War God', sanctuary: 'Sanctuary', sunder: 'Sunder', snapshot: 'Snapshot',
    soulshot: 'Soulshot', light: 'Power of Light', iban: 'Iban Blast', lightning: "Saradomin's Lightning" };
  function stepText([kind, arg]) {
    if (kind === 'discard') return arg ? `Discard ${an(arg)}` : 'Discard any card';
    if (kind === 'spend') return 'Put a material from play into your discard';
    if (kind === 'have') return `Have ${plural(arg[1], FAM[arg[0]])} in play`;
    return { weapon: 'Have a weapon', armor: 'Have armor', shield: 'Have a shield' }[kind];
  }
  function rewardText(c) {
    return {
      heal: `Heal ${c.reward_val}`, draw: `Draw ${c.reward_val}`, fetch_rune: 'Put a rune from your deck into play',
      fetch_bar: 'Put a bar from your deck into play', fetch_prayer: 'Search your deck for a prayer',
      lose_action: "Your opponent's next turn has 1 action", damage: `${c.reward_val} damage that ignores armor and reactions`,
      chicken: "Your opponent's weapon becomes a chicken", silverlight: 'Equip the best weapon in your deck',
      dragon_slayer: 'Put an armor and a shield from your deck into play',
      none: c.name === 'Romeo & Juliet' ? "Nothing. It's Romeo & Juliet." : 'Nothing',
    }[c.effect] || '';
  }
  function cardInfo(c) {
    const t = [];
    let type = '';
    let stat = '';
    switch (c.kind) {
      case 'material':
        type = `Material · ${FAM[c.mat] || c.mat}`;
        t.push(c.combo.length ? `Counts as 1 ${c.combo[0]} and 1 ${c.combo[1]} at once.` : 'Stays in play. Never spent.');
        break;
      case 'spell':
        type = 'Spell';
        stat = c.damage ? `${c.damage} Magic` : 'No damage';
        if (c.heals) t.push(`Heal ${c.heals}.`);
        if (c.wears) t.push(`Their weapon loses ${c.wears} durability (or ammo ${plural(c.wears, 'shot')}).`);
        if (c.fetch) t.push(`Play ${c.fetch} from your deck${c.draws ? ', then draw a card' : ''}.`);
        else if (c.draws) t.push(`Draw ${c.draws}.`);
        break;
      case 'weapon':
        type = `Weapon · ${c.wclass || 'blade'}${c.legendary ? ' · Legendary' : ''}`;
        stat = `Hit ${c.hit}${c.hits > 1 ? ' ×' + c.hits : ''} · Dur ${c.durability}`;
        if (c.styles.length > 1) t.push(`Swings as ${c.styles.map((s) => S[s]).join(' or ')}.`);
        else if (c.styles.length === 1 && c.styles[0] !== 'melee') t.push(`Hits as ${S[c.styles[0]]}.`);
        if (c.hits > 1) t.push(`Each swing hits ${c.hits} times.`);
        if (c.two_handed) t.push('Two-handed.');
        if (c.free_swing_after_spell) t.push('After you cast a spell, one free swing that turn.');
        if (c.spec) t.push(specText(c) + '.');
        if (c.legendary) t.push("Can't attack the turn it's played. Breaks shields it hits.");
        break;
      case 'thrown': type = `Thrown · ${c.wclass}`; stat = `Hit ${c.hit} · ${c.durability} throws`; t.push('Ranged. One throw per swing.'); break;
      case 'staff':
        type = 'Staff';
        stat = `Swing ${c.hit} Magic · Dur ${c.durability}`;
        for (const [m, k] of c.counts_as) t.push(countsText(m, k));
        if (c.spec) t.push(specText(c) + '.');
        break;
      case 'bow':
        type = c.style === 'magic' ? 'Battlestaff · bow' : c.bash_hit ? 'Bow · hybrid' : 'Bow';
        stat = `Hit ${c.hit} · ${TIER[c.arrow_tier]} arrows`;
        t.push('Comes with 4 Bronze shots. Never breaks.');
        if (c.bash_hit) t.push(`Bash ${c.bash_hit} Melee (dur ${c.durability}). Soak ${c.soak}, two-handed.`);
        for (const [m, k] of c.counts_as) t.push(countsText(m, k));
        if (c.spec) t.push(specText(c) + '.');
        break;
      case 'arrows': type = `Arrows · ${TIER[c.arrow_tier]}`; stat = `+${c.arrow_bonus} per shot`; t.push('4 shots for your bow.'); break;
      case 'ability':
        type = 'Ability · Melee';
        stat = `Swing +${c.damage}`;
        t.push(`With ${an(c.allowed.join(' or '))}.`);
        if (c.ignores_armor) t.push('Ignores armor.');
        if (c.durability > 1) t.push(`Uses ${c.durability} durability.`);
        break;
      case 'rapid': type = 'Ability · Ranged'; stat = '2 shots'; t.push('Fire 2 shots, or throw twice, as one action.'); break;
      case 'longrange': type = 'Ability · Ranged'; stat = '1 shot −1'; t.push('Melee damage you take −2 until your next turn.'); break;
      case 'destroy':
        type = c.item ? 'Item' : c.style === 'magic' ? 'Spell' : 'Ability';
        if (c.damage) stat = `${c.damage} damage`;
        t.push(c.damage ? `${c.damage} damage, then destroy one of your opponent's ${FAM[c.destroys]}s if they have one.`
          : `Destroy one of your opponent's ${FAM[c.destroys]}s.`);
        if (c.needs_melee_weapon) t.push('Needs a Melee weapon equipped.');
        break;
      case 'pouch': type = 'Item'; t.push('Put a rune of your choice from your deck into play.'); break;
      case 'armor':
        type = `Armor · ${S[c.style] || 'any style'}`;
        stat = c.armor.map(([s, m]) => `${S[s]} ${m > 0 ? '+' : '−'}${Math.abs(m)}`).join(' · ');
        t.push('Changes the damage you take.');
        if (c.bonus) t.push(`Your attacks +${c.bonus}.`);
        if (c.families) t.push(`Needs ${c.families} material types in play.`);
        break;
      case 'shield': type = 'Shield'; stat = `Soak ${c.soak}`; t.push(c.free ? 'Free to play.' : 'Soaks damage until it breaks.');
        if (c.unshatter) t.push('Shatter doesn’t break it: Legendary hits and Sunder only use up what they hit for.'); break;
      case 'hammer': type = 'Item'; stat = `+${c.bonus}`; t.push(`+${c.bonus} durability to your weapon (not a Legendary), or +${c.bonus} soak to your shield.`); break;
      case 'teleport': type = 'Item · teleport'; t.push(`Play ${c.fetch} from your deck.`); break;
      case 'food': type = 'Food'; stat = `Heal ${c.heal}`; t.push(c.stacks_with_food ? 'Eat it with other food.' : 'One food a turn.'); t.push('Shuffles discards under your deck.'); break;
      case 'prayer': type = 'Reaction · Prayer'; stat = `Block ${S[c.prayer]}`; t.push(`On their turn: block one ${S[c.prayer]} attack.`); break;
      case 'reversal': type = 'Reaction'; stat = `${S[c.reacts_to]} → ${S[c.converts_to]}`; t.push(`On their turn: a ${S[c.reacts_to]} attack comes back as ${S[c.converts_to]}.`); break;
      case 'buff':
        type = c.duration ? 'Elite prayer' : 'Prayer';
        stat = c.effect === 'smite' ? 'Smite' : c.effect === 'redemption' ? 'Redemption' : `${S[c.prayer]} +${c.bonus}`;
        if (c.effect === 'smite') t.push(`All your attacks +${c.bonus}. When your attack deals damage, their prayer ends.`);
        if (c.effect === 'redemption') t.push(`When damage leaves you at 1–10 cards, heal ${c.reward_val}.`);
        t.push(c.duration ? 'Lasts 3 of your turns. Free.' : 'Lasts until replaced. Free.');
        break;
      case 'npc': {
        const NPC_WORD = { item: 'item', buff: 'prayer', prayer: 'Protect prayer', any: 'card' };
        type = c.legendary ? 'NPC · Legendary' : 'NPC';
        const what = c.recovers.map((r) => NPC_WORD[r] || FAM[r] || r).join(' or ');
        t.push(`Recover ${an(what)} from your discard.`);
        if (c.recovers.some((r) => FAM[r] || r === 'any')) t.push('Materials go back into play.');
        break;
      }
      case 'location':
        type = 'Location';
        t.push({
          "Wizards' Tower": 'Magic damage +2, for both players.', Wilderness: 'All damage +2, for both players.',
          Lumbridge: 'The first time damage would empty a player’s deck, they keep its last card. Once per player.',
          Varrock: 'Either player, as an action: discard a card from hand to heal 3.',
          'Mage Arena': 'Magic damage +2, Ranged damage −2, for both players.',
          'Duel Arena': 'No food, no prayers of any kind. Active prayers end when it arrives.',
          'Grand Exchange': 'Once a turn, free: discard a card from hand to draw a card. Either player.',
        }[c.name] || '');
        break;
      case 'quest':
        type = `Quest · ${c.qp} QP`;
        c.steps.forEach((s, k) => t.push(`${k + 1}. ${stepText(s)}`));
        t.push(`Reward: ${rewardText(c)}`);
        break;
      default: break;
    }
    return { type, stat, text: t, req: reqText(c) };
  }

  // =====================================================================================
  // Drawing pieces (the components on the canvas's component sheet)
  // =====================================================================================
  const RARITY = { C: 'Common', U: 'Uncommon', R: 'Rare', L: 'Legendary' };
  const GLYPH = { material: 'M', food: 'F', npc: 'N', location: 'L', quest: 'Q', shield: 'S', hammer: 'I', pouch: 'I', buff: 'P',
    prayer: 'P', reversal: 'R', destroy: 'D', teleport: 'I' };
  const STYLES = ['melee', 'ranged', 'magic'];
  const MAT_COLOR = { 'Bronze Bar': '#b0773c', 'Mithril Bar': '#5b6fa8', 'Rune Bar': '#3d9fb0', 'Enchanted Bar': '#7a5bb0',
    'Mithril Grapple': '#5b8f8a', 'Normal Logs': '#9a7448', 'Willow Logs': '#8f9d55', 'Yew Logs': '#6e4a2a',
    'Enchanted Logs': '#8a6ab0', 'Air Rune': '#f4f4f4', 'Fire Rune': '#d8503a', 'Water Rune': '#3f7fd0', 'Earth Rune': '#6c8a3a',
    'Chaos Rune': '#e0a030', 'Death Rune': '#202020', 'Blood Rune': '#a01818', 'Smoke Rune': '#8c8c8c', 'Dust Rune': '#b8a070',
    'Mist Rune': '#a9c4e0', 'Lava Rune': '#c8602a', 'Steam Rune': '#b8b8c8', 'Mud Rune': '#7a6040' };

  // The bot's move, shown big for a moment before it resolves: the card it plays, or a label for a non-card action.
  async function showMove(g, i, a, reactCard = null) {

        spec: [`${w ? SPEC_NAME[w.spec] : 'Special attack'}`, w ? art(w.name) : ''], claim: [`Claims the ${a[1]}`, AS.cape[a[1]] ? `<img src="${AS.cape[a[1]].src}" alt="">` : ''],
        quest: ['Takes a quest step', ICON.quest ? `<img src="${ICON.quest}" alt="">` : ''], varrock: ['Rests in Varrock', ''], exchange: ['Trades at the Grand Exchange', ''],
      }[a[0]] || [a[0], ''];

  // =====================================================================================
  // Animations from the engine. The board is always drawn from the real state. At every pause in the
  // game (after a move, before anyone decides) settle() compares the state last shown with the state
  // now, draws the new board, hides what is about to arrive, and plays the difference: cards flying
  // from the hand to their slot, attacks travelling to the deck and milling cards into the discard,
  // heals, draws, broken shields, quests, capes, the turn changing hands.
  // =====================================================================================
  // The table is a plane tilted away from you: the bot's side is further off and smaller. Everything you
  // hold or press (hand, actions, turn, End turn) floats flat on top of it. Plane coordinates are 1920 x 780.
  const TABLE = { w: 1920, h: 780, tilt: 30, pers: 1500 };
  const ROW = { bot: 8, you: 522, h: 250 }, STRIP = { top: 272, h: 236 };
  const rowTop = (i) => (i === ui.you ? ROW.you : ROW.bot);
  // The stage is sized to the screen (see stageFor): menus fill any shape edge to edge, from 4:3 to 21:9, and
  // are taller in stage pixels on big screens than on small ones, so text and buttons stay readable on a phone.
  // The duel is always 1920 wide; its height follows the screen's shape.
  let stageH = 1080, stageW = 1920;
  const SH = () => stageH;
  const SW = () => stageW;
  const TOUCH = () => document.documentElement.classList.contains('touch');
  const tapWord = (cap) => (TOUCH() ? (cap ? 'Tap' : 'tap') : cap ? 'Click' : 'click');
  const planeBottom = () => SH() - 276;
  function proj(x, y) {                                // a point on the table -> where it shows on the stage (the CSS 3D maths)
    const th = TABLE.tilt * Math.PI / 180, P = TABLE.pers, oy = SH() * 1.1;
    const dy = y - TABLE.h, Y = planeBottom() + dy * Math.cos(th), z = dy * Math.sin(th), f = P / (P - z);
    return { x: 960 + (x - 960) * f, y: oy + (Y - oy) * f };
  }
  const projRect = (x, y, w, h) => { const a = proj(x, y), b = proj(x + w, y + h); return { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y }; };
  const sceneOpen = () => `<div class="scene" style="perspective:${TABLE.pers}px;perspective-origin:960px ${Math.round(SH() * 1.1)}px"><div class="plane" style="top:${planeBottom() - TABLE.h}px;transform:rotateX(${TABLE.tilt}deg)">`;
  const anim = { shown: null, ev: 0, hint: null, held: null, drop: null, reactFrom: null, playing: false, inApply: false };
  const HOLD_YOU = { x: 430, y: 236, w: 225, h: 315 }, HOLD_BOT = { x: 848, y: 150, w: 225, h: 315 };
  const tempo = () => (calm() ? 0 : fast() ? 0.12 : 1);
  const SLOTS = ['weapon', 'shield', 'armor', 'ammo', 'prayer', 'quest'];
  const STAYS = new Set(['weapon', 'thrown', 'bow', 'staff', 'shield', 'armor', 'arrows', 'buff', 'material', 'quest', 'location']);
  const STYLE_COL = { melee: '#ff9b85', ranged: '#9fd986', magic: '#9cc3e6', none: '#f3d27a' };

  function snap(g) {
    return { active: g.active, winner: g.winner, loc: g.location, locOwner: g.location_owner,
      p: g.players.map((p) => ({ hand: [...p.hand], deck: p.deck.length, disc: [...p.discard], mats: { ...p.materials },
        weapon: p.weapon ? p.weapon.name : null, wdur: p.weapon ? p.weapon.dur : 0, shield: p.shield ? p.shield.name : null,
        armor: p.armor || null, ammo: p.ammo ? p.ammo.card || null : null, prayer: p.buff || null,
        quest: p.quest ? p.quest.name : null, energy: p.energy, qp: p.qp, wear: p.cape || 0 })),
      capes: Object.fromEntries(g.cape_table.map((c) => [c, { by: c in g.cape_claimed ? g.cape_claimed[c] : null, prog: [0, 1].map((i) => g.progress(g.players[i], c)[0]) }])) };
  }
  function msDiff(a, b) {                     // the items of a that b doesn't have (as multisets), in a's order
    const left = {};
    for (const x of b) left[x] = (left[x] || 0) + 1;
    return a.filter((x) => (left[x] ? (left[x]--, false) : true));
  }
  const take = (arr, x) => { const k = arr.indexOf(x); if (k < 0) return false; arr.splice(k, 1); return true; };
  const at = (key) => document.querySelector(`#board [data-at="${CSS.escape(key)}"]`);
  const slotCard = (i, s) => { const n = at(`${i}:${s}`); return n && (s === 'quest' ? n.querySelector('[data-zoom]') : n.querySelector('.mc')); };
  const mid = (r) => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });
  const pileRect = (i, kind) => projRect(kind === 'deck' ? 1600 : 1756, rowTop(i) + 22, 140, 196);
  const matSpot = (i) => projRect(420, rowTop(i) + 40, 160, 150);
  function handPos(el) {
    const rot = +((/rotate\((-?[\d.]+)deg\)/.exec(el.style.transform) || [0, 0])[1]);
    return { el, name: el.dataset.zoom || null, x: parseFloat(el.style.left), y: parseFloat(el.style.top), w: el.offsetWidth, h: el.offsetHeight, rot };
  }
  function capture() {
    const r = {};
    document.querySelectorAll('#board [data-at]').forEach((n) => { r[n.dataset.at] = stageXY(n); });
    for (const i of [0, 1]) for (const s of SLOTS) { const c = slotCard(i, s); if (c) r[`${i}:${s}:card`] = stageXY(c); }
    r.hand = [[], []];
    r.hand[ui.you] = [...document.querySelectorAll('#board .hc')].map(handPos);
    r.hand[1 - ui.you] = [...document.querySelectorAll('#board [data-bh]')].map(handPos);
    return r;
  }
  const fxAdd = (cls, html, style = '') => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; if (style) d.style.cssText = style; $('#fx').appendChild(d); return d; };
  const done = (a) => a.finished.catch(() => {});

  // A card flying between two board rects (stage px). flip 'up' turns a back face up on the way, 'down' the reverse.
  function flyCard(o) {
    const el = document.createElement('div');
    el.className = 'fly' + (o.flip ? ' flip' : '');
    const back = `<img class="cb" src="${CREST}" alt="">`;
    el.innerHTML = o.flip ? `<div class="fly-in"><div class="fs">${o.name ? cardFace(o.name) : back}</div><div class="fs bf">${back}</div></div>` : o.name ? cardFace(o.name) : back;
    $('#fx').appendChild(el);
    const place = (r, rot = 0) => { const s = r.w / 375; return `translate(${r.x}px,${r.y + (r.h - 525 * s) / 2}px) scale(${s}) rotate(${rot}deg)`; };
    const w = Math.max(o.from.w, o.to.w) * (o.grow || 1.1);
    const top = { x: (o.from.x + o.to.x) / 2 - (w - (o.from.w + o.to.w) / 2) / 2, y: Math.min(o.from.y, o.to.y) - (o.lift == null ? 50 : o.lift), w, h: w * 1.4 };
    const kf = [{ transform: place(o.from, o.rot0 || 0), opacity: o.fadeIn ? 0 : 1 },
      { transform: place(top, o.spin || 0), opacity: 1, offset: 0.5 },
      { transform: place(o.to, 0), opacity: o.fadeOut ? 0 : 1 }];
    const opt = { duration: o.dur, delay: o.delay || 0, easing: 'cubic-bezier(.35,.15,.25,1)', fill: 'both' };
    const a = el.animate(kf, opt);
    if (o.flip) el.firstChild.animate(o.flip === 'up' ? [{ transform: 'rotateY(180deg)' }, { transform: 'rotateY(180deg)', offset: 0.25 }, { transform: 'rotateY(0deg)' }]
      : [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(0deg)', offset: 0.25 }, { transform: 'rotateY(180deg)' }], opt);
    if (o.onStart) setTimeout(o.onStart, o.delay || 0);

  }
  function pop(el) {
    if (!el) return;
    el.style.visibility = '';
    if (!el.classList.contains('hc')) el.animate([{ transform: 'scale(1.14)', filter: 'brightness(1.7)' }, { transform: 'scale(1)', filter: 'brightness(1)' }], { duration: 300, easing: 'ease-out' });
  }
  const hide = (el) => { if (el) el.style.visibility = 'hidden'; return el; };
  function floatAt(text, kind, x, y, size) {
    const d = fxAdd(`float ${kind}`, '', `left:${x}px;top:${y}px;${size ? `font-size:${size}px` : ''}`);
    d.textContent = text;
    setTimeout(() => d.remove(), 1400);
  }
  function stampAt(text, x, y, col, size, dur) {
    const d = fxAdd('stamp', esc(text), `left:${x}px;top:${y}px;font-size:${size}px;--c:${col}`);
    const a = d.animate([{ transform: 'translate(-50%,-50%) scale(1.8)', opacity: 0 }, { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: 0.18 },
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: 0.75 }, { transform: 'translate(-50%,-60%) scale(1.02)', opacity: 0 }], { duration: dur, easing: 'ease-out', fill: 'both' });
    return done(a).then(() => d.remove());
  }
  function ring(p, col, size, dur) {
    const d = fxAdd('proj ring', '', `--c:${col}`);
    const a = d.animate([{ transform: `translate(${p.x}px,${p.y}px) scale(.4)`, opacity: 1 }, { transform: `translate(${p.x}px,${p.y}px) scale(${size / 24})`, opacity: 0 }], { duration: dur, easing: 'ease-out' });
    done(a).then(() => d.remove());
  }
  function shake(el, px, dur) {
    if (el) el.animate([{ translate: '0 0' }, { translate: `${-px}px 0` }, { translate: `${px * 0.8}px 0` }, { translate: `${-px * 0.5}px 0` }, { translate: `${px * 0.3}px 0` }, { translate: '0 0' }], { duration: dur });
  }
  function glow(el, col, dur) {
    if (el) el.animate([{ boxShadow: `0 0 0 0 ${col}` }, { boxShadow: `0 0 0 4px ${col}, 0 0 40px 6px ${col}` }, { boxShadow: `0 0 0 0 ${col}` }], { duration: dur, easing: 'ease-out' });
  }

  async function settle(g) {
    if (!g || ui.g !== g) return;
    const T = tempo();
    const before = anim.shown, after = snap(g);
    const evs = g.events.slice(anim.ev);
    anim.ev = g.events.length;
    anim.shown = after;
    const hint = anim.hint, held = anim.held, reactFrom = anim.reactFrom, drop = anim.drop;
    anim.hint = anim.held = anim.reactFrom = anim.drop = null;
    if (ui.replaying || ui.intro || !before || !T) { if (held) held.el.remove(); $('#reveal').innerHTML = ''; render(); return; }
    const R0 = capture();
    anim.playing = true;
    try { await playChanges(g, before, after, evs, { hint, held, reactFrom, drop }, R0, T); }
    finally { anim.playing = false; if (held && held.el.isConnected) held.el.remove(); $('#reveal').innerHTML = ''; render(); }
  }

  async function playChanges(g, B, A, evs, ctx, R0, T) {
    const D = (ms) => ms * T;
    const you = ui.you;
    const turned = A.active !== B.active && A.winner === null;
    // ---- what moved, per player ----
    const M = [0, 1].map((i) => {
      const b = B.p[i], a = A.p[i];
      const matUp = [], matDown = [];
      for (const m of new Set([...Object.keys(a.mats), ...Object.keys(b.mats)])) {
        const d = (a.mats[m] || 0) - (b.mats[m] || 0);
        for (let k = 0; k < Math.abs(d); k++) (d > 0 ? matUp : matDown).push(m);
      }
      return { b, a, lostHand: msDiff(b.hand, a.hand), gotHand: msDiff(a.hand, b.hand), discIn: msDiff(a.disc, b.disc), discOut: msDiff(b.disc, a.disc), matUp, matDown,
        slotsOut: SLOTS.filter((s) => b[s] && b[s] !== a[s]).map((s) => ({ key: s, name: b[s], from: R0[`${i}:${s}:card`] || R0[`${i}:${s}`] })),
        slotsIn: SLOTS.filter((s) => a[s] && a[s] !== b[s]).map((s) => ({ key: s, name: a[s] })) };
    });
    render();                                   // the new board, then roll it back visually and play forward
    const pile = [0, 1].map((i) => ({ deck: B.p[i].deck, disc: B.p[i].disc.length, top: B.p[i].disc[B.p[i].disc.length - 1] || null }));
    const setPile = (i) => {
      const st = pile[i];
      const dn = at(`${i}:deckn`); if (dn && dn.firstChild) dn.firstChild.textContent = Math.max(0, Math.round(st.deck));
      const cn = at(`${i}:discn`); if (cn && cn.firstChild) cn.firstChild.textContent = Math.max(0, Math.round(st.disc));
      const d = at(`${i}:disc`);
      if (d && d.tagName === 'BUTTON') d.innerHTML = st.top ? mini(st.top, {}).replace('class="mc"', 'class="mc" style="box-shadow:none"') : '';
      if (A.winner === null && Math.min(pile[0].deck, pile[1].deck) <= 10) duelIntense(true);   // the music turns as the counter does
    };
    setPile(0); setPile(1);
    const deckR = (i) => R0[`${i}:deck`] || pileRect(i, 'deck');
    const discR = (i) => R0[`${i}:disc`] || pileRect(i, 'disc');

    // ---- the hands: cards that stayed slide to their new places; the rest are sources or arrivals ----
    const now = [[], []];
    now[you] = [...document.querySelectorAll('#board .hc')].map(handPos);
    now[1 - you] = [...document.querySelectorAll('#board [data-bh]')].map(handPos);
    const fresh = [[], []], spare = [[], []];
    for (const i of [0, 1]) {
      const used = new Set();
      for (const n of now[i]) {
        const j = R0.hand[i].findIndex((o, k) => !used.has(k) && o.name === n.name);
        if (j < 0) { fresh[i].push(n); continue; }
        used.add(j);
        const o = R0.hand[i][j];
        if (Math.abs(o.x - n.x) + Math.abs(o.y - n.y) + Math.abs(o.rot - n.rot) > 1) {
          n.el.animate([{ transform: `translate(${o.x - n.x}px,${o.y - n.y}px) rotate(${o.rot}deg)` }, { transform: `rotate(${n.rot}deg)` }], { duration: D(340), easing: 'cubic-bezier(.3,.7,.3,1)' });
        }

      spare[i] = R0.hand[i].filter((o, k) => !used.has(k));
    }
    const handSrc = (i, name) => {
      if (ctx.drop && ctx.drop.name === name && i === you) { const r = ctx.drop.rect; ctx.drop = null; return r; }
      const k = spare[i].findIndex((o) => o.name === name || o.name === null);
      if (k >= 0) { const o = spare[i].splice(k, 1)[0]; return { x: o.x, y: o.y, w: o.w, h: o.h, rot: o.rot }; }
      return i === you ? { x: 840, y: SH() - 254, w: 230, h: 322 } : { x: 900, y: botHandTop(), w: 120, h: 168 };
    };

    // ---- the card that was played ----
    let cast = null;
    const phase1 = [];
    const h = ctx.hint;
    if (h && h.name && take(M[h.i].lostHand, h.name)) {
      const i = h.i, m = M[i];
      const src = ctx.held ? ctx.held.rect : h.from || (i === you ? handSrc(i, h.name) : HOLD_BOT);
      const sIn = m.slotsIn.find((s) => s.name === h.name);
      let destEl = null, isNew = true;
      if (sIn) { m.slotsIn.splice(m.slotsIn.indexOf(sIn), 1); destEl = slotCard(i, sIn.key); }
      else if (take(m.matUp, h.name)) { destEl = at(`${i}:mt:${h.name}`); isNew = !(M[i].b.mats[h.name] > 0); }
      else if (A.loc === h.name && B.loc !== A.loc) destEl = at('loc');
      if (destEl) {
        if (ctx.held) ctx.held.el.remove();
        if (isNew) hide(destEl);

      } else if (take(m.discIn, h.name)) {
        const hold = i === you ? HOLD_YOU : HOLD_BOT;

        else { sfx('reveal', { v: 0.6 }); phase1.push(flyCard({ name: h.name, from: src, to: hold, dur: D(380), rot0: src.rot || 0, keep: true }).then((el) => { cast.el = el; })); }

      if (B.loc && B.loc !== A.loc && B.locOwner === i && take(pool, B.loc)) out[i].push({ name: B.loc, from: R0.loc });
      for (const mm of [...m.matDown]) if (take(pool, mm)) { take(m.matDown, mm); out[i].push({ name: mm, from: R0[`${i}:mt:${mm}`] || R0[`${i}:mats`] }); }

    const drawAll = () => {

      else if (a.by !== null && a.by === b.by && A.p[a.by].wear > B.p[a.by].wear) ticks.push({ c, i: a.by, from: B.p[a.by].wear, to: A.p[a.by].wear, wear: true });
    }
    for (const t of ticks) {
      const row = t.wear ? $(`#board [data-cpw="${CSS.escape(t.c)}"]`) : $(`#board [data-cprow="${CSS.escape(`${t.c}|${t.i}`)}"]`);
      if (!row) continue;
      t.row = row; t.num = row.querySelector('.cpn'); t.bar = row.querySelector('.track i');
      t.need = t.wear ? 3 : +((t.num && t.num.textContent.split('/')[1]) || 0);
      t.col = row.dataset.col || (t.i === you ? 'var(--gold-hi)' : 'var(--bot-hi)');
