    if (c.kind === 'destroy') return c.needs_melee_weapon && !(w && w.kind === 'weapon') ? 'Needs a Melee weapon equipped.' : 'The bot has nothing it can destroy.';
    if (c.kind === 'location') return 'Already in play.';
    if (c.kind === 'hammer') return 'Needs a weapon with durability (not a Legendary) or a shield.';
    if (c.kind === 'buff') return g.free_plays_used >= g.rules.free_plays_max ? 'No free plays left this turn.' : 'Already active.';
    if (c.kind === 'quest') return p.completed.includes(name) ? 'Already completed.' : 'Already in progress.';
    if (!g.actions_left) return 'No actions left.';
    return 'Not playable right now.';
  }

  // =====================================================================================
  // Board
  // =====================================================================================
  const FAM_ORDER = ['bar', 'log', 'rune'];
  const FAM_WORD = { bar: 'Bars', log: 'Logs', rune: 'Runes', cloth: 'Cloth', leather: 'Leather' };

  function materialsHTML(p) {                // a chip per material in play: its art and how many
    const mine = ui.g && p === ui.g.players[ui.you];
    const pi = ui.g ? ui.g.players.indexOf(p) : 0;
    const ghosts = {};                                  // "counts as" from the weapon (Staff of Air = 2 Air)
    const w = p.weapon_card();
    if (w) for (const [m, k] of w.counts_as) ghosts[m] = (ghosts[m] || 0) + k;
    const names = Object.keys(p.materials).filter((m) => p.materials[m] > 0);
    for (const m of Object.keys(ghosts)) if (m !== 'Elemental Rune' && !p.materials[m] && CARDS[m]) names.push(m);
    const fo = (m) => { const k = FAM_ORDER.indexOf(CARDS[m].mat); return k < 0 ? 9 : k; };
    names.sort((a, b) => fo(a) - fo(b) || (p.materials[b] || 0) - (p.materials[a] || 0));
    const chips = names.map((m) => {
      const k = p.materials[m] || 0, a = ART[m];
      const img = a ? `<img src="${a.src}" alt=""${a.mode === 'px' ? ' style="image-rendering:pixelated"' : ''}>` : matSvg(m, 34);
      return `<div class="mchip${k ? '' : ' ghost'}" data-at="${pi}:mt:${esc(m)}" data-zoom="${esc(m)}"${mine || !k ? '' : ` data-zone="oppmat:${esc(m)}"`} aria-label="${esc(m)} ${k}">${img}<b>${k}</b>${ghosts[m] ? `<span class="mt-g">+${ghosts[m]}</span>` : ''}</div>`;
    }).join('');
    const elem = ghosts['Elemental Rune'] ? `<div class="mchip ghost"><b>+${ghosts['Elemental Rune']}</b><small>any element</small></div>` : '';
    return `<div class="mchips" data-at="${pi}:mats"${mine ? ' data-zone="mats"' : ''}>${chips + elem || '<span class="none">No materials yet</span>'}</div>`;
  }

  function slotsHTML(g, i) {
    const p = g.players[i];
    const w = p.weapon_card();
    let weapon = emptySlot('weapon'), wpips = '<div class="pp"></div>';
    if (w) {
      const style = w.kind === 'bow' ? 'ranged' : w.kind === 'staff' ? 'magic' : w.kind === 'thrown' ? 'ranged' : (w.styles[0] || w.style);
      const hitTxt = w.kind === 'staff' ? `Swing ${w.hit}` : `Hit ${w.hit}${w.hits > 1 ? '×' + w.hits : ''}`;
      const notyet = w.legendary && p.weapon.played === g.turn ? '<span class="notyet">NEXT TURN</span>' : '';
      weapon = mini(w.name, { key: w.kind === 'bow' && p.ammo ? w.hit + p.ammo.bonus : w.hit, foot: `${styleIcon(style)}${hitTxt}`, extra: notyet });
      if (w.kind !== 'bow' || w.bash_hit) { const max = Math.max(w.durability, p.weapon.dur); wpips = max > 8 ? `<div class="pp"><span class="inf">${p.weapon.dur}</span></div>` : pips(p.weapon.dur, max); }
      else wpips = '<div class="pp"><span class="inf">∞</span></div>';
    }
    let shield = emptySlot('shield'), spips = '<div class="pp"></div>';
    if (p.shield) {
      const max = Math.max(CARDS[p.shield.name].soak, p.shield.soak);
      shield = mini(p.shield.name, { key: p.shield.soak, foot: p.shield.virtual ? 'Bow soak' : 'Soak' });
      spips = max > 12 ? `<div class="pp"><span class="inf">${p.shield.soak}</span></div>` : pips(p.shield.soak, max, 'soak').replace('class="pp soak"', 'class="pp soak" style="gap:3px"');
    }
    const armor = p.armor ? mini(p.armor, { key: CARDS[p.armor].bonus ? '+' + CARDS[p.armor].bonus : '', foot: armorChips(p.armor), style: '' }).replace('class="mc-ft"', 'class="mc-ft" style="gap:6px"') : emptySlot('armor');
    let ammo = emptySlot('ammo'), apips = '<div class="pp"></div>';
    if (p.ammo) {
      if (p.ammo.card) ammo = mini(p.ammo.card, { key: '+' + p.ammo.bonus, foot: `${styleIcon('ranged')}Shots` });
      else ammo = `<div class="mc" style="--frame:${FRAME.ranged}"><div class="mc-in"><div class="mc-nm">Bronze shots</div><div class="mc-art">${ART['Bronze Arrows'] ? `<img src="${ART['Bronze Arrows'].src}" alt="">` : '<i>✦</i>'}</div><div class="mc-ft">From the bow</div></div><span class="key">+${p.ammo.bonus}</span></div>`;
      apips = pips(p.ammo.shots, Math.max(4, p.ammo.shots));
    }
    let prayer = emptySlot('prayer'), ppips = '<div class="pp"></div>';
    if (p.buff) {
      const b = CARDS[p.buff];
      const key = b.effect === 'smite' ? '+' + b.bonus : b.effect === 'redemption' ? '♥' : '+' + b.bonus;
      prayer = mini(p.buff, { key, foot: b.prayer && S[b.prayer] ? `${styleIcon(b.prayer)}${S[b.prayer]}` : esc(b.effect || 'Prayer'), style: 'border-radius:30px 30px 7px 7px' })
        .replace('class="mc-in"', 'class="mc-in" style="border-radius:26px 26px 4px 4px"').replace('class="mc-nm"', 'class="mc-nm" style="text-align:center;padding:9px 8px 4px;font-size:9.5px"');
      ppips = b.duration ? pips(p.buff_left, b.duration, 'round') : '<div class="pp"><span class="inf">∞</span></div>';
    }
    const mine = i === ui.you;               // your slots are drop targets
    const sl = (key, card, pp) => `<div class="sl" data-at="${i}:${key}"${mine ? ` data-zone="${key}"` : ''}>${card}${pp}</div>`;
    let quest = emptySlot('quest'), qpips = '<div class="pp"></div>';
    if (p.quest) {
      const q = CARDS[p.quest.name], now = q.steps[p.quest.step];
      quest = mini(q.name, { key: `${p.quest.step}/${q.steps.length}`, foot: `<span class="qstep">${now ? esc(stepText(now)) : 'Complete'}</span>` });
      qpips = pips(p.quest.step, q.steps.length, 'round');
    }
    return `<div class="slots">${sl('weapon', weapon, wpips)}${sl('shield', shield, spips)}${sl('armor', armor, '<div class="pp"></div>')}${sl('ammo', ammo, apips)}${sl('prayer', prayer, ppips)}${sl('quest', quest, qpips)}</div>`;
  }

  function questHTML(p) {
    const done = p.completed.slice(-2).map((n) => `<div style="display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;background:rgba(0,0,0,.28);border:1px solid rgba(201,165,75,.3)">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#79c25a"/><path d="M4.5 8.2l2.3 2.3 4.7-5" fill="none" stroke="#10200a" stroke-width="2"/></svg>
      <span style="font-family:var(--display);font-weight:700;font-size:13px;flex:1">${esc(n)}</span><b style="color:var(--gold-hi);font-size:12px">+${CARDS[n].qp}</b></div>`).join('');
    let body;
    if (p.quest) {
      const q = CARDS[p.quest.name];
      const a = ART[q.name];
      const steps = q.steps.map((s, k) => {
        const st = k < p.quest.step ? 'done' : k === p.quest.step ? 'now' : 'later';
        const mark = st === 'done' ? '<svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#3e6b34"/><path d="M4.5 8.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="2"/></svg>'
          : st === 'now' ? '<svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="#fff6dc" stroke="#b08a2e" stroke-width="2"/><circle cx="8" cy="8" r="2.5" fill="#b08a2e"/></svg>'
            : '<svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="#b9a982" stroke-width="1.5"/></svg>';
        return `<div style="display:flex;align-items:center;gap:7px;${st === 'done' ? 'color:#7d715a;text-decoration:line-through' : st === 'now' ? 'font-weight:700' : 'color:#7d715a'}">${mark}<span>${esc(stepText(s))}</span></div>`;
      }).join('');
      body = `<div data-zoom="${esc(q.name)}" style="flex:1;border-radius:10px;overflow:hidden;background:var(--parch);box-shadow:0 0 0 4px var(--neutral),0 6px 14px rgba(0,0,0,.5);margin:4px;display:flex;flex-direction:column;min-height:0">
        <div style="display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--ink)">${ICON.quest ? `<img src="${ICON.quest}" alt="" style="width:18px;height:18px">` : ''}<span style="font-family:var(--display);font-weight:700;font-size:14px;color:var(--gold-hi);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(q.name)}</span><span style="font-weight:700;font-size:12px;color:var(--cream)">${q.qp} QP</span></div>
        ${a && q.steps.length < 3 ? `<img src="${a.src}" alt="" style="display:block;width:100%;height:30px;object-fit:cover;border-bottom:1.5px solid var(--gold)">` : ''}
        <div style="padding:6px 10px;display:flex;flex-direction:column;gap:4px;color:var(--ink);font-size:13px;overflow:hidden">${steps}</div></div>`;
    } else body = `<div style="flex:1;border:1.5px dashed rgba(201,165,75,.35);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700">No quest</div>`;
    return `<div data-at="${ui.g ? ui.g.players.indexOf(p) : 0}:quest" style="width:230px;display:flex;flex-direction:column;gap:8px"${ui.g && p === ui.g.players[ui.you] ? ' data-zone="quest"' : ''}><div class="lbl" style="display:flex;justify-content:space-between">Quest<span style="color:var(--gold-hi)">QP ${p.qp}</span></div>${body}${done}</div>`;
  }

  function energyHTML(g, i) {
    const p = g.players[i];
    const w = p.weapon_card();
    const ready = w && w.spec && p.energy >= w.spec_cost && !(p.weapon && p.weapon.spec_used);
    const fx = [];
    if (p.sanctuary) fx.push(`<span class="fx-b">${ART.Excalibur ? `<img src="${ART.Excalibur.src}" alt="">` : ''}Sanctuary −${p.sanctuary}</span>`);
    if (p.light) fx.push(`<span class="fx-b">${styleIcon('melee')}Light ½</span>`);
    if (p.longrange) fx.push(`<span class="fx-b">${styleIcon('melee')}Longrange −2</span>`);
    if (p.free_swing_ready) fx.push('<span class="fx-b">Free swing</span>');
    if (p.lost_actions) fx.push('<span class="fx-b" style="border-color:var(--hurt)">Next turn: 1 action</span>');
    return `<div class="energy" data-at="${i}:energy">
      <div class="lbl">Special</div>
      <div style="display:flex;align-items:center;gap:10px"><div style="display:flex;gap:4px" aria-label="Special energy ${p.energy} of ${g.rules.max_energy}">${Array.from({ length: g.rules.max_energy }, (_, k) => `<span class="${k < p.energy ? 'seg1' : 'seg0'}"></span>`).join('')}</div><b style="font-family:var(--display);font-size:20px;color:#9fd986">${p.energy}</b></div>
      ${ready ? `<span class="fx-b" style="border-color:#9fd986;color:#9fd986;align-self:flex-start">${esc(SPEC_NAME[w.spec])} ready</span>` : ''}
      ${fx.length ? `<div class="lbl" style="margin-top:4px">Effects</div><div style="display:flex;flex-wrap:wrap;gap:6px">${fx.join('')}</div>` : ''}</div>`;
  }

  // ---------- capes ----------
  const CAPE_COND = {
    melee_hit: () => [ICON.melee, 'hits'], ranged_hit: () => [ICON.ranged, 'hits'], magic_hit: () => [ICON.magic, 'hits'],
    soak: () => [ART.Kiteshield && ART.Kiteshield.src, 'soaked'], elite_prayer: () => [ART.Piety && ART.Piety.src, 'elite'],
    food: () => [ART.Lobster && ART.Lobster.src, 'food'], bar: () => [ART['Bronze Bar'] && ART['Bronze Bar'].src, 'bars'],
    log: () => [ART['Normal Logs'] && ART['Normal Logs'].src, 'logs'], rune: () => [ART['Air Rune'] && ART['Air Rune'].src, 'runes'], qp: () => [ICON.quest, 'QP'],
  };
  function capeHTML(g, cape, left) {
    const you = ui.you, bot = 1 - you;
    const picks = g.rules.capes || [];
    const mine = picks[you] === cape, theirs = picks[bot] === cape;
    const pick = mine && theirs ? ['BOTH PICKED', 'background:var(--gold);color:#1a1410'] : mine ? ['YOUR PICK', 'background:var(--gold);color:#1a1410'] : ['BOT\'S PICK', 'background:var(--bot);color:#e3f0fa;border:1px solid var(--gold)'];
    const pic = AS.cape[cape];
    const art = pic ? `<img class="${pic.mode}" src="${pic.src}" alt="">` : '<i>✦</i>';
    const def = CAPES[cape];
    const [cIcon, cWord] = (CAPE_COND[def.what] || (() => ['', '']))();
    const claimedBy = cape in g.cape_claimed ? g.cape_claimed[cape] : null;
    let cls = '', body;
    if (claimedBy === null) {
      const row = (k) => {
        const [have, need] = g.progress(g.players[k], cape);
        const isYou = k === you;
        const col = isYou ? (def.what.endsWith('_hit') ? FRAME[def.what.split('_')[0]] : 'var(--melee)') : 'var(--bot)';
        const meter = need <= 7
          ? `<div style="display:flex;gap:4px;flex:1">${Array.from({ length: need }, (_, x) => `<span class="bx ${x < have ? 'on' : 'off'}" style="${x < have ? `background:${col}` : ''}"></span>`).join('')}</div>`
          : `<div class="track"><i style="width:${Math.min(100, 100 * have / need)}%;background:${col}"></i></div>`;
        const near = !isYou && have >= need - 1 && have < need;
        return `<div data-cprow="${esc(cape)}|${k}" data-col="${col}" style="display:flex;align-items:center;gap:8px;${near ? 'margin:-3px -6px;padding:3px 6px;border-radius:6px;background:rgba(156,195,230,.08);box-shadow:0 0 0 1.5px rgba(156,195,230,.55),0 0 14px rgba(156,195,230,.3)' : ''}${have >= need ? ';' : ''}">
          <span class="who ${isYou ? 'you' : 'bot'}">${isYou ? 'YOU' : 'BOT'}</span>${meter}<b class="cpn" style="font-family:var(--display);font-size:16px;color:${have >= need ? 'var(--gold-pale)' : have ? (isYou ? 'var(--gold-hi)' : 'var(--bot-hi)') : 'var(--faint)'};min-width:44px;text-align:right">${Math.min(have, 99)}/${need}</b></div>`;
      };
      const canYou = g.claimable(you).includes(cape);
      const canBot = g.claimable(bot).includes(cape);
      if (canYou) cls = 'ready';
      else if (canBot) cls = 'danger';
      body = `${row(you)}${row(bot)}<div style="display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid rgba(201,165,75,.2)">
        <span class="lbl" style="font-size:10px">Wear</span><span class="ctr"></span><span class="ctr"></span><span class="ctr"></span>
        <span style="margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.12em;color:${canYou ? 'var(--gold-hi)' : canBot ? 'var(--hurt)' : 'var(--faint)'}">${canYou ? 'READY TO CLAIM' : canBot ? 'BOT CAN CLAIM' : 'UNCLAIMED'}</span></div>`;
    } else {
      const isYou = claimedBy === you;
      const n = g.players[claimedBy].cape || 0;
      cls = n >= 2 ? (isYou ? 'mine' : 'danger') : '';
      body = `<div style="display:flex;align-items:center;gap:10px"><span class="who ${isYou ? 'you' : 'bot'}">${isYou ? 'YOU' : 'BOT'}</span><span class="lbl" style="color:var(--cream)">wear it</span></div>
        <div data-cpw="${esc(cape)}" style="display:flex;align-items:center;gap:10px">${[0, 1, 2].map((k) => `<span class="ctr ${k < n ? 'on' + (isYou ? '' : ' botc') : ''}" style="width:34px;height:34px"></span>`).join('')}
        <b class="cpn" style="font-family:var(--display);font-size:20px;color:${isYou ? 'var(--gold-hi)' : 'var(--bot-hi)'}">${n}/3</b></div>
        <div style="margin-top:auto;font-family:var(--display);font-weight:700;font-size:${n >= 2 ? 20 : 14}px;color:${n >= 2 ? (isYou ? 'var(--gold-hi)' : 'var(--hurt)') : 'var(--muted)'}">${n >= 3 ? (isYou ? 'YOU WIN' : 'BOT WINS') : n >= 2 ? (isYou ? 'ONE TURN LEFT' : 'BOT WINS NEXT TURN') : `${3 - n} of ${isYou ? 'your' : 'its'} turns to go`}</div>`;
    }
    const blind = ui.intro ? `<img class="capeback" src="${CREST}" alt="" style="--d:${left < 900 ? 4.55 : 4.75}s">` : '';   // blind picks flip face up
    return `<div class="capew" style="left:${left}px;top:${STRIP.top + 12}px"><div class="capet ${cls}" data-at="cape:${esc(cape)}"><div class="cape-art"><div>${art}</div>${blind}<span class="pick" style="${pick[1]}">${pick[0]}</span></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:9px;min-width:0"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span style="font-family:var(--display);font-weight:700;font-size:20px;color:var(--gold-hi);white-space:nowrap">${esc(cape)}</span>
      <span style="display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:var(--cream)">${cIcon ? `<img src="${cIcon}" alt="" style="width:18px;height:18px;object-fit:contain">` : ''}${cWord}</span></div>${body}</div></div></div>`;
  }

  // ---------- location ----------
  function locBadge(name) {
    const b = (icons, txt) => `<div style="position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px;padding:6px 12px 6px 8px;border-radius:30px;background:var(--parch);border:3px solid var(--gold);box-shadow:0 3px 8px rgba(0,0,0,.6)">${icons}<b style="font-family:var(--display);font-size:${txt.length > 3 ? 15 : 26}px;color:var(--ink);line-height:1;margin-left:3px">${txt}</b></div>`;
    const ic = (s, w = 28) => `<img src="${ICON[s]}" alt="${S[s]}" style="width:${w}px;height:${w}px;object-fit:contain">`;
    switch (name) {
      case "Wizards' Tower": return b(ic('magic'), '+2');
      case 'Wilderness': return b(ic('melee', 18) + ic('ranged', 18) + ic('magic', 18), '+2');
      case 'Mage Arena': return b(ic('magic', 20), '+2') + `<div style="position:absolute;right:12px;bottom:8px;display:flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;background:var(--parch);border:2px solid var(--gold)">${ic('ranged', 16)}<b style="color:var(--ink);font-family:var(--display)">−2</b></div>`;
      case 'Lumbridge': return b('', 'Last card saved');
      case 'Varrock': return b('', 'Rest: heal 3');
      case 'Duel Arena': return b('', 'No food · no prayer');
      case 'Grand Exchange': return b('', 'Trade 1 a turn');
      default: return '';
    }
  }
  function locationHTML(g) {
    if (!g.location) {
      return `<div class="locw" style="top:${STRIP.top + 14}px"><div class="abs" data-zone="loc" data-at="loc" style="left:0;top:0;width:320px;height:180px;border:1.5px dashed rgba(201,165,75,.4);border-radius:10px;background:rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3c-5 0-9 4-9 9 0 7 9 15 9 15s9-8 9-15c0-5-4-9-9-9z" fill="none" stroke="rgba(201,165,75,.6)" stroke-width="2"/><circle cx="15" cy="12" r="3" fill="none" stroke="rgba(201,165,75,.6)" stroke-width="2"/></svg>
        <span class="lbl" style="color:var(--faint)">No location</span></div></div>`;
    }
    const n = g.location, a = ART[n];
    const yours = g.location_owner === ui.you;
    const flag = yours
      ? `<span style="position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);z-index:2;padding:2px 10px;border-radius:6px 6px 0 0;background:var(--gold);color:#1a1410;font-size:11px;font-weight:700;letter-spacing:.14em">▼ YOU</span>`
      : `<span style="position:absolute;left:50%;top:-9px;transform:translateX(-50%);z-index:2;padding:2px 10px;border-radius:0 0 6px 6px;background:var(--bot);border:1.5px solid var(--gold);border-top:none;color:#e3f0fa;font-size:11px;font-weight:700;letter-spacing:.14em">▲ BOT</span>`;
    let art = '<span style="font-size:44px;color:var(--gold);opacity:.3">✦</span>';
    if (a && a.mode === 'tall') art = `<img src="${a.src}" alt="" style="position:absolute;left:-20px;top:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(14px) brightness(.7)"><img src="${a.src}" alt="" style="position:relative;height:100%">`;
    else if (a) art = `<img src="${a.src}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`;
    return `<div class="locw" style="top:${STRIP.top + 14}px"><div class="abs" data-zone="loc" data-at="loc" style="left:0;top:0;width:320px;height:180px" data-zoom="${esc(n)}">${flag}
      <div style="height:100%;padding:6px;border-radius:10px;background:var(--neutral);box-shadow:0 0 0 1px var(--gold),0 10px 24px rgba(0,0,0,.6)">
      <div style="height:100%;border-radius:6px;overflow:hidden;background:var(--parch);display:flex;flex-direction:column">
        <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--ink)"><div class="ci" style="width:30px;height:30px;border-width:2px"><b style="font-size:14px">L</b></div>

  }
  function backdropHTML(g) {

  // ---------- piles ----------
  const edges = (n) => {          // one dark + one paper line per ~5 cards, max 7: the pile looks thicker or thinner
    const layers = Math.min(7, Math.ceil(n / 5));
    const s = [];
    for (let k = 1; k <= layers; k++) s.push(`0 ${3 * k - 1}px 0 #0b0806`, `0 ${3 * k}px 0 #6b5a3c`);

  };
  function pilesHTML(g, i) {
    const p = g.players[i];

    const deck = p.lp
      ? `<div class="bk" ${dz} style="left:1600px;top:${top}px;width:140px;height:196px;overflow:visible;box-shadow:${edges(p.lp)}"><div style="width:140px;height:196px;border-radius:8px;overflow:hidden">${backImg(140, 196)}</div></div>`
      : `<div class="abs" ${dz} style="left:1600px;top:${top}px;width:140px;height:196px;border:2px dashed var(--hurt);border-radius:8px"></div>`;
    const plaque = `<div class="plq${low ? ' low' : ''}" id="deck-${i}" data-at="${i}:deckn" style="left:1606px;top:${top + 150}px;width:128px;height:70px"><b style="font-size:42px">${p.lp}</b><span class="dbar"><i style="width:${Math.round(100 * p.lp / 60)}%;${low ? 'background:var(--hurt)' : ''}"></i></span></div>`;
    const topCard = p.discard[p.discard.length - 1];
    const ddz = `${i === ui.you ? 'data-zone="mydiscard" ' : ''}data-at="${i}:disc"`;               // NPCs recover from it; hand-limit discards go to it
    const disc = topCard
      ? `<div class="abs" style="left:1756px;top:${top}px"><button type="button" ${ddz} data-do="viewdiscard" data-v="${i}" aria-label="${i === ui.you ? 'Your' : 'Bot'} discard pile, ${p.discard.length} cards" style="display:block;padding:0;border:0;background:none;border-radius:7px;box-shadow:${edges(p.discard.length)};zoom:1.25">${mini(topCard, {}).replace('class="mc"', 'class="mc" style="box-shadow:none"')}</button></div>`
      : `<div class="abs" ${ddz} style="left:1756px;top:${top}px;width:140px;height:196px;border:2px dashed rgba(201,165,75,.35);border-radius:8px"></div>`;

    return deck + plaque + '<!--split-->' + disc + dplaque;

  // ---------- nameplates ----------
  function nameplate(g, i) {

    const chip = (inner) => `<span class="npc">${inner}</span>`;

      ${chip(`<svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><rect x="1" y="3" width="9" height="12" rx="1.5" fill="none" stroke="#cdbf9f" stroke-width="1.5"/><rect x="4" y="1" width="9" height="12" rx="1.5" fill="#2a2420" stroke="#cdbf9f" stroke-width="1.5"/></svg>${p.hand.length}${you ? '/' + g.rules.hand_max : ''}`)}</div></div></div>`;

  function deckStyle(x) {
    const tally = {};
    const cards = typeof x === 'string' ? (deckObj(x) || {}).cards || {} : x || {};

      const c = CARDS[n];
      if (['weapon', 'thrown', 'bow', 'staff', 'spell', 'ability', 'rapid', 'longrange'].includes(c.kind) && S[c.style]) tally[c.style] = (tally[c.style] || 0) + k;
    }
    return Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0] || 'neutral';
  }

  // ---------- turn banner + actions ----------

      <div style="display:flex;align-items:baseline;justify-content:space-between;width:100%"><span style="font-family:var(--display);font-weight:700;font-size:34px;color:${col};line-height:1;text-shadow:0 0 14px ${mine ? 'rgba(243,210,122,.5)' : 'rgba(156,195,230,.5)'}">${mine ? 'YOUR TURN' : "BOT'S TURN"}</span>
        <span style="font-size:14px;font-weight:800;letter-spacing:.2em;color:var(--muted)">TURN ${g.turn + 1}</span></div>
      <div style="display:flex;align-items:center;gap:12px;width:100%"><span class="lbl" style="font-size:14px">Actions</span><div style="display:flex;gap:12px" aria-label="${left} of ${total} actions left">${Array.from({ length: total }, (_, k) => `<span class="${k >= total - left ? 'dp1' + (mine ? '' : ' b') : 'dp0'}"></span>`).join('')}</div>
        <span class="lbl" style="font-size:14px;margin-left:auto">Free</span><div style="display:flex;gap:8px" aria-label="${freeLeft} free plays left">${Array.from({ length: g.rules.free_plays_max }, (_, k) => `<span class="${k >= g.rules.free_plays_max - freeLeft ? 'fp1' : 'fp0'}"></span>`).join('')}</div></div></div>`;
  }

  function coreActions() {
    const pend = ui.pending;

    const by = (...t) => legal.filter(([a]) => t.includes(a[0]));

  }
  function actionsHTML(g) {

    const punch = A.punch.length ? dmg(g, you, g.rules.punch_damage, 'melee', { ignore_armor: true, ignore_prayer: true, src: 'punch' }) : null;
    const swing = A.swing.length ? swingDmg(g, you, A.swing[0][0]) : null;

    const freeSwing = A.swing.some(([a]) => a[0] === 'free_swing');

    const questFree = p.free_steps < g.rules.free_quest_steps;
    return `<div class="abs" style="left:24px;top:${SH() - 252}px"><div class="acts">
      ${btn('draw', '<svg width="26" height="30" viewBox="0 0 26 30" aria-hidden="true"><rect x="2" y="6" width="16" height="22" rx="2.5" fill="none" stroke="#cdbf9f" stroke-width="2"/><rect x="8" y="2" width="16" height="22" rx="2.5" fill="#2a2420" stroke="#f3d27a" stroke-width="2"/><path d="M16 9v8M12 13h8" stroke="#f3d27a" stroke-width="2"/></svg>', 'Draw', '+1 card', A.draw)}
      ${btn('punch', ICON.punch ? `<img src="${ICON.punch}" alt="">` : '', 'Punch', punch ? dmgText(punch) : '', A.punch)}
      ${btn('swing', wImg, freeSwing ? 'Free swing' : 'Swing', swing ? dmgText(swing) : '', A.swing, freeSwing, true)}
      ${btn('spec', '<svg width="22" height="28" viewBox="0 0 22 28" aria-hidden="true"><path d="M13 1L3 16h7l-2 11 11-16h-7z" fill="none" stroke="#9fd986" stroke-width="2" stroke-linejoin="round"/></svg>', 'Special', w && w.spec ? `${esc(SPEC_NAME[w.spec])} · ${w.spec_cost}` : '', A.spec, specFree)}
      ${btn('quest', ICON.quest ? `<img src="${ICON.quest}" alt="" style="width:26px;height:26px">` : '', 'Quest', q ? `step ${p.quest.step + 1}/${q.steps.length}` : '', A.quest, questFree)}
      ${btn('claim', '<svg width="24" height="30" viewBox="0 0 24 30" aria-hidden="true"><path d="M6 2h12l-2 4 5 22H3L8 6z" fill="none" stroke="#f3d27a" stroke-width="2" stroke-linejoin="round"/></svg>', 'Claim', A.claim.length ? esc(A.claim[0][0][1].replace(' Cape', '')) : '', A.claim, false, true)}
    </div></div>`;

  function endTurnHTML(g) {
    const A = coreActions();

    if (g.active !== ui.you) return `<button type="button" class="endturn wait" ${at} disabled><svg width="22" height="28" viewBox="0 0 22 28" aria-hidden="true"><path d="M3 2h16M3 26h16M5 2c0 8 12 8 12 12S5 18 5 26M17 2c0 8-12 8-12 12s12 4 12 12" fill="none" stroke="#9cc3e6" stroke-width="2"/></svg>BOT'S TURN
      ${ui.intro ? '' : '<small class="thinking" aria-label="The bot is thinking">thinking <i></i><i></i><i></i></small>'}</button>`;

      ${left ? `<small>${plural(left, 'action')} unused</small>` : ''}</button>`;
  }

  // ---------- hands ----------
  function handLayout(n) {
    const spacing = n > 1 ? Math.min(158, 820 / (n - 1)) : 0;
    const mid = (n - 1) / 2;
    return Array.from({ length: n }, (_, k) => {
      const d = k - mid;
      return { left: 955 + d * spacing - 115, top: SH() - 254 + Math.round(d * d * (n > 6 ? 3.2 : 5)), rot: d * (n > 6 ? 2.6 : 3.6), z: 11 + k };
    });
  }
  function myHandHTML(g) {
    const p = g.players[ui.you];
    const pend = ui.pending;
    const playable = new Set(), usable = new Set();
    if (pend && pend.type === 'choose') for (const a of pend.legal) {
      if (a[0] === 'play') playable.add(a[1]);
      if (a[0] === 'varrock' || a[0] === 'exchange') usable.add(a[1]);
    }
    const reactOpts = pend && pend.type === 'react' ? new Set(pend.opts) : new Set();
    const pos = handLayout(p.hand.length);
    let pop = '';
    if (ui.intro) {                          // dealt face down from your deck, flipping face up as they land
      return p.hand.map((n, k) => {
        const { left, top, rot, z } = pos[k];
        const d = DEAL_START + k * DEAL_STEP + DEAL_STEP / 2;
        const dc = proj(1670, ROW.you + 120), dx = dc.x - (left + 115), dy = dc.y - (top + 161);
        return `<div class="hc deal" style="left:${left}px;top:${top}px;--rot:${rot}deg;transform:rotate(${rot}deg);z-index:${z};--d:${d}s;--dx:${dx}px;--dy:${dy}px;box-shadow:0 12px 22px rgba(0,0,0,.65)">
          ${cardFace(n)}<img class="dealback" src="${CREST}" alt="" style="--d2:${d + 0.5}s"></div>`;
      }).join('');
    }
    const cards = p.hand.map((n, k) => {
      let cls = 'hc', act = 'peek';
      let { left, top, rot, z } = pos[k];
      const isSel = ui.selected === k;
      if (pend && pend.type === 'choose') { if (playable.has(n) || usable.has(n)) { cls += ' ok'; act = 'select'; } else cls += ' no'; }
      else if (pend && pend.type === 'react') { if (reactOpts.has(n)) { cls += ' react'; act = 'react'; top -= 130; rot = 0; z = 31; } else { cls += ' no'; top += 70; } }
      else if (pend && pend.type === 'discard') { cls += ' toss'; act = 'toss'; }
      else { cls += ' no'; top += g.active === ui.you ? 0 : 60; }
      if (isSel) { cls += ' sel'; top -= 56; rot = 0; z = 35; pop = handPopover(g, n, k, left, top); }
      return `<div class="${cls}" role="button" tabindex="0" data-do="${act}" data-v="${k}" data-zoom="${esc(n)}" aria-label="${esc(n)}"
        style="left:${left}px;top:${top}px;transform:rotate(${rot}deg)${isSel ? ' scale(1.06)' : ''};z-index:${z}">${cardFace(n)}</div>`;
    }).join('');
    return cards + pop;
  }
  function handPopover(g, name, k, left, top) {
    const pend = ui.pending;
    if (!pend || pend.type !== 'choose') return '';
    const opts = pend.legal.map((a, j) => [a, j]).filter(([a]) => ['play', 'varrock', 'exchange'].includes(a[0]) && a[1] === name);
    const x = Math.max(20, Math.min(1920 - 400, left + 115 - 190));
    if (!opts.length) {
      return `<div class="pop" style="left:${x}px;bottom:${SH() - top + 14}px;border-color:var(--hurt)"><div class="why"><svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="9" cy="9" r="8" fill="#8e2b23"/><path d="M5.5 5.5l7 7M12.5 5.5l-7 7" stroke="#fff" stroke-width="2"/></svg>${esc(whyNot(g, ui.you, name))}</div></div>`;
    }
    const items = opts.map(([a, j]) => {
      const [b, s] = optLabel(g, ui.you, a);
      const free = g.is_free(ui.you, a, g.free_plays_used);
      return `<button type="button" class="opt${free ? ' free' : ''}" data-do="act" data-v="${j}"><b>${esc(b)}${free ? ' · free' : ''}</b>${s ? `<small>${s}</small>` : ''}</button>`;
    }).join('');
    return `<div class="pop" style="left:${x}px;bottom:${SH() - top + 14}px">${items}<button type="button" class="opt cancel" data-do="unselect"><b>Back</b></button></div>`;
  }
  const botHandTop = () => Math.max(-40, Math.round(proj(0, 0).y / 2 - 96));      // the bot's hand, face down, across the top
  function botHandHTML(g) {
    const n = g.players[1 - ui.you].hand.length;
    const spacing = n > 1 ? Math.min(80, 540 / (n - 1)) : 0;
    const mid = (n - 1) / 2, top0 = botHandTop();
    const dc = proj(1670, ROW.bot + 120);
    const cards = Array.from({ length: n }, (_, k) => {
      const d = k - mid;
      const left = 960 + d * spacing - 60, top = top0 + Math.round((mid * mid - d * d) * 3);   // held from across the table: the fan arcs the other way, ends up and middle down
      const deal = ui.intro ? ' deal' : '';
      const vars = ui.intro ? `--rot:${-d * 4}deg;--d:${DEAL_START + k * DEAL_STEP}s;--dx:${dc.x - (left + 60)}px;--dy:${dc.y - (top + 84)}px;` : '';
      return `<div class="bk${deal}" data-bh="${k}" style="${vars}left:${left}px;top:${top}px;width:120px;height:168px;transform:rotate(${-d * 4}deg);transform-origin:50% 0;box-shadow:0 8px 16px rgba(0,0,0,.6)">${backImg(120, 168, true)}</div>`;
    }).join('');
    return cards + (n && !ui.intro ? `<div class="bhn" style="left:${960 + mid * spacing + 72}px;top:${top0 + 64}px" aria-label="The bot holds ${n} cards">${n}</div>` : '');
  }

  // ---------- prompts ----------
  function reactHTML(g) {
    const pd = ui.pending;
    const att = 1 - ui.you;
    const [take, soak] = g.compute_damage(att, pd.amount, pd.style);
    const last = [...g.log].reverse().find((e) => e.action);
    const opts = pd.opts.map((name) => {
      const c = CARDS[name];
      let what;

        ${opts}
        <button type="button" class="btn-d" data-do="react" data-v="" style="height:58px;font-size:20px">Take it</button>
        <span class="lbl" style="color:var(--faint)">1 reaction per round · drag a glowing card up or ${tapWord()} it</span></div>`;
  }
  function discardHTML(g) {
    const p = g.players[ui.you];
    const over = p.hand.length - g.rules.hand_max;
    return `<div class="panel" style="position:absolute;left:740px;top:${SH() - 420}px;width:440px;padding:14px 18px;z-index:40;border:2px solid var(--hurt);text-align:center">
      <span class="ttl" style="font-size:22px">Hand limit ${g.rules.hand_max}</span><div style="margin-top:6px;font-size:15px">Drag ${plural(over, 'card')} to your discard pile, or ${tapWord()} ${over === 1 ? 'it' : 'them'}</div></div>`;
  }
  function coreMenuHTML(g) {
    const m = ui.menu;
    const items = m.opts.map(([a, j]) => { const [b, s] = optLabel(g, ui.you, a); return `<button type="button" class="opt" data-do="act" data-v="${j}"><b>${esc(b)}</b>${s ? `<small>${s}</small>` : ''}</button>`; }).join('');

    return `<div class="pop" style="${at}">${items}<button type="button" class="opt cancel" data-do="unselect"><b>Back</b></button></div>`;
  }

  // ---------- log drawer ----------
  function logHTML(g) {

  // ---------- Champion's thinking time, measured on this device (Settings) ----------
  // A fixed practice duel, Champion against Guard, run off screen on the same engine and with the same
  // breathing room as a real duel. Nothing is saved and the result doesn't touch your profile.
  const bench = { running: false, n: 0, ms: 0, max: 0, token: null };
  const BENCH_MOVES = 40;
  const secs = (ms) => (ms / 1000).toFixed(ms < 995 ? 2 : 1) + ' s';
  function benchText() {
    if (!bench.n) return bench.running ? 'Thinking…' : '';
    const avg = secs(bench.ms / bench.n);
    return bench.running ? `${bench.n} / ${BENCH_MOVES} moves · ${avg} a move so far`
      : `${avg} a move on average, ${secs(bench.max)} at most (${bench.n} moves)`;
  }
  async function benchChampion() {
    if (bench.running) return;
    const token = (bench.token = {});
    Object.assign(bench, { running: true, n: 0, ms: 0, max: 0 });
    const show = () => { const el = document.getElementById('benchOut'); if (el) el.textContent = benchText(); };
    render();
    const starters = DECKS.filter((d) => d.group === 'Starter decks');
    const hard = LV.makeBot('hard', 9091, { pause: 12 });
    const timed = {
      setup: (g) => hard.setup(g),
      choose: async (g, i, legal) => {
        const t0 = performance.now();
        const a = await hard.choose(g, i, legal);
        if (legal.length > 1) { const ms = performance.now() - t0; bench.n++; bench.ms += ms; bench.max = Math.max(bench.max, ms); show(); }
        return a;
      },
      react: (...a) => hard.react(...a),
      discard_choice: (...a) => hard.discard_choice(...a),
    };
    await sleep(50);
    let seed = 20261115;
    try {
      while (bench.token === token && bench.n < BENCH_MOVES) {     // a short duel may not be enough moves: play another
        const a = starters[seed % starters.length], b = starters[(seed + 1) % starters.length];
        const g = new R.Game([a.cards, b.cards], [timed, new HeuristicBot(seed)], seed, { capes: [a.capes[0], b.capes[0]] }, ['Champion', 'Guard']);
        while (g.winner === null && g.turn < 400 && bench.token === token && bench.n < BENCH_MOVES) await g.play_turn();
        seed++;
      }
    } finally {
      if (bench.token === token) { bench.running = false; bench.token = null; if (ui.modal === 'settings') render(); }
    }
  }
  const benchStop = () => { bench.token = null; bench.running = false; };

  // ---------- the duel is over: results and GP ----------
  function finishDuel(g, conceded = false) {
    if (ui.config && ui.config.tutorial) {           // no GP or record: a free pack instead
      const won = !conceded && g.winner === ui.you;
      if (won) profile.tutorial = 'done';
      saveProfile();
      ui.result = { tutorial: true, won, config: ui.config, g: null };
      ui.tut = null;
      ui.screen = 'result';
      render();
      AU.sting(won ? 'victory' : 'defeat');
      return;
    }
    const won = !conceded && g.winner === ui.you, draw = !conceded && g.winner === null;
    const fresh = profile.paid !== ui.config.seed;          // pays once, whatever happens next
    const before = profile.gp;
    const pay = !fresh || conceded ? 0 : won ? PAY.win : PAY.loss;
    if (fresh) { profile.gp += pay; if (won) profile.wins += 1; else if (!draw) profile.losses += 1; profile.paid = ui.config.seed; saveProfile(); }
    const p = g.players[ui.you], b = g.players[1 - ui.you];
    const reason = conceded ? 'concede' : g.end_reason;
    ui.result = { won, draw, conceded, reason, turn: g.turn + 1, youLp: p.lp, botLp: b.lp, pay, before, after: profile.gp, shown: before, ticked: false,
      cape: reason === 'cape' ? (won ? p : b).cape_name : null, config: ui.config, g: conceded ? null : g };
    store.del(STORE);
    ui.screen = 'result';
    render();
    AU.sting(won ? 'victory' : 'defeat');
    if (pay && !calm()) setTimeout(() => sfx('coins', { n: won ? 10 : 4 }), 800);
    tickGP();
  }
  function tickGP() {                         // the balance counts up once the coins have landed
    const r = ui.result;
    if (!r || r.ticked) return;
    r.ticked = true;
    if (!r.pay || calm()) { r.shown = r.after; render(); return; }
    const t0 = performance.now() + 1300, dur = 900;
    const step = (now) => {
      if (ui.result !== r) return;
      const k = Math.max(0, Math.min(1, (now - t0) / dur));
      const was = r.shown;
      r.shown = Math.round(r.before + (r.after - r.before) * (1 - Math.pow(1 - k, 3)));
      if (Math.floor(r.shown / 10) !== Math.floor(was / 10)) sfx('coin', { v: 0.6 });
      const el = document.getElementById('gpnow');
      if (el) el.textContent = r.shown.toLocaleString();
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // ---------- Deck Wizard: pick up to two cards, get a whole deck built around them ----------
  const WIZ = window.RSTCGWiz;
  const WIZ_GAMES = 12;                        // test games per starter deck, per candidate
  function openWizard() {
    ui.wiz = { focus: [], q: '', type: 'all', page: 0, state: 'pick', prog: 0, step: '', result: null, name: '', token: null };
    ui.screen = 'wizard';
  }
  function wizList() {
    const w = ui.wiz, q = w.q.trim().toLowerCase(), kinds = TYPES[w.type][1];
    return POOL.filter((n) => owned(n) > 0 && !isBasic(n) && (!q || n.toLowerCase().includes(q)) && (!kinds || kinds.includes(CARDS[n].kind)));
  }
  async function wizBuild() {
    const w = ui.wiz;
    if (!WIZ || !w.focus.length || w.state === 'building') return;
    const token = (w.token = {});
    w.state = 'building'; w.prog = 0; w.step = 'Looking for decks that suit your cards'; render();
    await sleep(60);
    const builds = WIZ.candidates(w.focus, owned, { rarity: rarityOf, count: 4 });
    if (ui.wiz !== w || w.token !== token) return;
    if (!builds.length) { w.state = 'pick'; w.fail = true; render(); return; }
    const scored = [];
    for (let k = 0; k < builds.length; k++) {
      const b = builds[k];
      w.step = `Testing a build on the ${b.template} list`;
      const bar = () => { const el = $('#wizbar'); if (el) el.style.width = `${Math.round(100 * w.prog)}%`; const t = $('#wizstep'); if (t) t.textContent = w.step; };
      bar();
      const res = await WIZ.evaluate(b.cards, { games: WIZ_GAMES, cape: b.cape, seed: 101, yieldEvery: 3, onProgress: (f) => { w.prog = (k + f) / builds.length; bar(); } });
      if (ui.wiz !== w || w.token !== token) return;
      scored.push({ ...b, ...res });
    }
    scored.sort((a, b) => b.rate - a.rate);
    const best = scored[0];
    w.result = { ...best, tried: scored.length };
    w.name = `${w.focus[0].replace(/^The /, '')} Deck`.slice(0, 28);
    w.state = 'result';
    sfx('save');
    render();
  }
  function wizHTML() {

        <button type="button" class="btn-g" data-do="wizbuild" ${w.focus.length && !busy ? '' : 'disabled'} style="height:84px;font-size:30px;${w.focus.length && !busy ? '' : 'opacity:.5;cursor:default'}">${busy ? 'Building…' : 'Create deck'}</button></div></div>`;
    return `<div class="table"></div>${back}${filters}${grid}${panel}`;
  }
  function wizResultHTML() {
    const w = ui.wiz, r = w.result;

    const left = sortDeck(r.cards).map(([n, k]) => [n, k]);

        ${profile.lastPack ? '<button type="button" class="btn-d" data-do="lastpack" style="align-self:flex-start;height:44px;padding:0 16px;font-size:14px">See your last pack</button>' : ''}</div>`)}${topBar('Packs', `${profile.packs || 0} opened`, 'menu')}`;
  }

  // ---------- show-off screens (packs, pack opening, pack summary, results) ----------
  // These are pictures composed on a 1920x1080 canvas. On any other stage shape the canvas is centred and
  // shrunk to fit (never enlarged), while the background still fills the whole screen.
  function designBox() { const k = Math.min(1, SW() / 1920, SH() / 1080); return { k, x: (SW() - 1920 * k) / 2, y: (SH() - 1080 * k) / 2 }; }
  function boxed(html) {
    const B = designBox();
    if (B.k === 1 && !B.x && !B.y) return html;
    return `<div class="dbox" style="position:absolute;left:${B.x.toFixed(1)}px;top:${B.y.toFixed(1)}px;width:1920px;height:1080px;transform:scale(${B.k.toFixed(4)});transform-origin:0 0">${html}</div>`;
  }

  // ---------- Opening a pack ----------
  // The pack shakes and tears, the six cards fan out face down (their backs glow by rarity, Commons
  // first and the Rare or Legendary last), and you flip them one at a time or all at once.
  function fanPos(k, n) {
    const mid = (n - 1) / 2, d = k - mid;
    const gap = n <= 6 ? 210 : 160;
    return { left: 960 - 75 + d * gap, top: 382 + Math.round(d * d * (n <= 6 ? 8 : 4)), rot: d * (n <= 6 ? 4 : 3) };
  }
  function openHTML() {
    const P = ui.pack;
    const n = P.cards.length;
    const pips = P.cards.map((c, k) => `<span class="rar" style="width:14px;height:14px;${P.up[k] ? `background:${RAR[c.rar].col}` : `border:2px solid ${RAR[c.rar].col}`};${c.rar === 'L' ? 'box-shadow:0 0 8px rgba(255,157,46,.8)' : ''}"></span>`).join('');
    const cards = P.cards.map((c, k) => {
      const { left, top, rot } = fanPos(k, n);

      const up = P.up[k];
      const halo = !up && (c.rar === 'L' || c.rar === 'R') ? `<div class="po-halo ${c.rar === 'L' ? 'leg' : 'rare'}" style="left:${left + 75 - 200}px;top:${top + 105 - 200}px"></div>` : '';

      return `${halo}<div class="po${up ? ' up' : ''}${up && P.just === k ? ' flip-' + c.rar : ''}${!up && c.rar === 'L' ? ' tremble' : ''}${P.stage === 'fan' ? ' fan' : ''}" data-do="${up ? '' : 'flip'}" data-v="${k}" ${up ? `data-zoom="${esc(c.name)}"` : 'role="button" tabindex="0"'} aria-label="${up ? esc(c.name) : `Face-down ${RAR[c.rar].name}`}"
        style="left:${left}px;top:${top}px;--rot:${rot}deg;--fx:${960 - 75 - left}px;--fy:${540 - 105 - top}px;transform:rotate(${rot}deg);--d:${(k * 0.07).toFixed(2)}s;box-shadow:${glow},0 12px 20px rgba(0,0,0,.6)">

    return `<div class="table"></div><div style="position:absolute;inset:0;background-image:radial-gradient(ellipse at 50% 55%,rgba(243,210,122,.12) 0%,transparent 55%),radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 35%,rgba(0,0,0,.7) 100%)"></div>
      ${dim}${boxed(`<div style="position:absolute;left:0;right:0;top:46px;display:flex;flex-direction:column;align-items:center;gap:14px"><span class="ttl" style="font-size:40px">Set 1 Booster</span>
        <div style="display:flex;gap:8px" aria-label="${P.up.filter(Boolean).length} of ${n} revealed">${pips}</div></div>
      ${wrapper}${P.stage === 'tear' ? '' : cards}
      ${P.stage === 'tear' ? '' : `<div style="position:absolute;left:0;right:0;top:900px;display:flex;justify-content:center;align-items:center;gap:22px">
        ${allUp ? '<button type="button" class="btn-g" data-do="packsum" style="width:300px;height:76px;font-size:26px">See summary</button>'
          : `<span class="lbl" style="color:var(--faint)">${tapWord(1)} a card to flip</span><button type="button" class="btn-d" data-do="revealall" style="width:240px;height:70px;font-size:22px">Reveal all</button>
             <button type="button" class="btn-d" data-do="packsum" style="width:200px;height:70px;font-size:18px;border-color:rgba(201,165,75,.45);color:var(--muted)">Skip to summary</button>`}</div>
      <div style="position:absolute;left:0;right:0;top:1010px;display:flex;justify-content:center;gap:28px;font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--muted)">
        ${['C', 'U', 'R', 'L'].map((r) => `<span style="display:inline-flex;align-items:center;gap:8px">${rarDot(r)}${RAR[r].name.toUpperCase()}</span>`).join('')}</div>`}`)}`;
  }
  async function startPack(cards) {
    sfx('coins', { n: 5 });
    if (!calm()) { setTimeout(() => sfx('shake'), 100); setTimeout(() => sfx('tear'), 650); [1250, 1340, 1430, 1520].forEach((ms) => setTimeout(() => sfx('draw', { v: 0.6 }), ms)); }
    const order = { C: 0, U: 1, R: 2, L: 3 };
    ui.pack = { cards: [...cards].sort((a, b) => order[a.rar] - order[b.rar]), up: cards.map(() => false), stage: calm() ? 'fan' : 'tear', just: -1, dim: false };
    ui.screen = 'open';
    render();
    if (ui.pack.stage === 'tear') {
      const P = ui.pack;
      await sleep(1250);
      if (ui.pack !== P) return;
      P.stage = 'fan'; render();
      await sleep(900);

    }
  }
  function flipCard(k) {
    const P = ui.pack;
    if (!P || P.up[k]) return;
    P.up[k] = true; P.just = k; P.stage = 'ready';
    const c = P.cards[k];
    sfx('flip');
    if (c.rar === 'U') sfx('uncommon'); else if (c.rar === 'R') sfx('rare'); else if (c.rar === 'L') { sfx('rare'); AU.sting('legendary'); }
    P.dim = c.rar === 'L' && !calm();
    render();
    if (c.rar === 'L' || c.rar === 'R') burst(k, c.rar);
    if (P.dim) setTimeout(() => { if (ui.pack === P) { P.dim = false; const d = $('.po-dim'); if (d) d.remove(); } }, 1600);
  }
  function burst(k, rar) {                       // sparks off a Rare or Legendary as it turns over
    if (calm()) return;

    const B = designBox();
    const cx = B.x + (left + 75) * B.k, cy = B.y + (top + 105) * B.k, n = rar === 'L' ? 22 : 12;
    const col = rar === 'L' ? '#ffd28a' : '#d9b6ff';
    for (let j = 0; j < n; j++) {
      const a = (j / n) * Math.PI * 2 + Math.random() * 0.4, dist = 120 + Math.random() * (rar === 'L' ? 160 : 90);

    }

  async function revealAll() {

  function summaryHTML() {

      ${c.isNew ? '<span class="tag-new" style="left:50%;top:-14px;transform:translateX(-50%)">NEW</span>' : `<span class="own" style="right:6px;top:6px">×${c.have}</span>`}<div class="ps-r"></div></div>`;
    const can = profile.gp >= PACK_COST;
    return `<div class="table"></div>${boxed(`
      <div style="position:absolute;left:0;right:0;top:46px;display:flex;flex-direction:column;align-items:center;gap:16px"><span class="ttl" style="font-size:44px">Pack Summary</span>
        <div style="display:flex;gap:14px">
          <span style="display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:20px;background:#17240f;border:1.5px solid #79c25a;font-weight:800;font-size:16px;color:#b9e3a5"><b style="font-family:var(--display);font-size:22px;color:#fff">${fresh}</b>NEW</span>

      <div style="position:absolute;left:0;right:0;top:${cards.length <= 6 ? 330 : 190}px;display:grid;justify-content:center;grid-template-columns:repeat(${cards.length <= 6 ? cards.length : 5},195px);column-gap:40px;row-gap:52px">${cards.map(tile).join('')}</div>
      <div style="position:absolute;left:0;right:0;top:900px;display:flex;justify-content:center;align-items:center;gap:22px">
        <button type="button" class="btn-g" data-do="buypack" ${can ? '' : 'disabled'} style="width:380px;height:90px;font-size:28px;gap:14px;${can ? '' : 'opacity:.55;cursor:not-allowed;filter:grayscale(.4)'}">Open another<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:rgba(0,0,0,.35);font-size:20px">${ICON.gp50 ? `<img src="${ICON.gp50}" alt="" style="width:32px;height:20px;object-fit:contain">` : ''}${PACK_COST}</span></button>
        <button type="button" class="btn-d" data-do="decks" style="width:280px;height:90px;font-size:24px">Go to decks</button>
        <button type="button" class="btn-d" data-do="menu" style="width:200px;height:90px;font-size:20px">Main menu</button>
        <span style="margin-left:10px">${gpChip(22)}</span></div>`)}`;
  }

  // ---------- dragging a card from the collection into the deck ----------
  const edDrag = { st: null, eat: false };
  document.addEventListener('pointerdown', (e) => {
    edDrag.eat = false;
    if (ui.screen !== 'editor' || e.button !== 0) return;
    const el = e.target.closest('.cc[data-card]');
    if (!el || el.classList.contains('cc-no') || e.target.closest('.cc-minus')) return;
    const p = toStage(e.clientX, e.clientY);
    edDrag.st = { name: el.dataset.card, x0: p.x, y0: p.y, moved: false, el };
  });
  window.addEventListener('pointermove', (e) => {
    const d = edDrag.st;
    if (!d) return;
    const p = toStage(e.clientX, e.clientY);
    if (!d.moved) {
      if (Math.hypot(p.x - d.x0, p.y - d.y0) < 10) return;
      d.moved = true; hideZoom();
      $('#drag').innerHTML = `<div class="ghost" style="width:165px;height:231px">${cardFace(d.name).replace('class="cf"', 'class="cf" style="transform:scale(.44);transform-origin:0 0"')}</div>`;
      d.ghost = $('#drag .ghost'); d.ghost.style.boxShadow = '0 0 0 3px var(--gold-pale),0 0 26px 6px rgba(243,210,122,.55),20px 30px 30px rgba(0,0,0,.7)';
      const dk = $('.dropdeck'); if (dk) dk.classList.add('drop-on');
    }
    d.ghost.style.left = `${p.x - 82}px`; d.ghost.style.top = `${p.y - 115}px`;
    const over = !!(document.elementFromPoint(e.clientX, e.clientY) || { closest: () => null }).closest('.panel .dropdeck, [data-drop="deck"]') || p.x > cardGridLayout(300).px;
    const dk = $('.dropdeck'); if (dk) dk.classList.toggle('drop-hot', over);
    d.over = over;
  });
  window.addEventListener('pointerup', () => {
    const d = edDrag.st;
    edDrag.st = null;
    if (!d || !d.moved) return;
    edDrag.eat = true;
    $('#drag').innerHTML = '';
    if (d.over) edAdd(d.name);
    render();
  });
  window.addEventListener('click', (e) => { if (edDrag.eat) { edDrag.eat = false; e.stopPropagation(); e.preventDefault(); } }, true);
  document.addEventListener('contextmenu', (e) => {
    if (ui.screen !== 'editor') return;
    const el = e.target.closest('.cc[data-card], .dl');
    if (!el) return;
    e.preventDefault();
    const n = el.dataset.card || (el.querySelector('[data-do="edrem"]') || {}).dataset?.v;
    if (n) { edRemove(n); render(); }
  });
  // typing in the search, deck name and rename boxes
  document.addEventListener('input', (e) => {
    const k = e.target.dataset && e.target.dataset.input;
    if (!k) return;
    if (k === 'edq') { ui.ed.q = e.target.value; ui.ed.page = 0; render(); }
    else if (k === 'wizq') { ui.wiz.q = e.target.value; ui.wiz.page = 0; render(); }
    else if (k === 'wizname') { ui.wiz.name = e.target.value; }
    else if (k === 'edname') { ui.ed.name = e.target.value; ui.ed.dirty = true; }
    else if (k === 'deckname') ui.renameText = e.target.value;
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.input === 'deckname') act('renamedone');
  });

  // =====================================================================================
  // Drag and drop. A card is picked up after it moves 10px (shorter is a click). Only the zones
  // its legal options point at light up; dropping on one plays it, several options open a chooser
  // at the drop point, anywhere else springs the card back to the hand.
  // =====================================================================================
  // Where on the board each legal option is dropped
  function zoneFor(a) {
    if (a[0] === 'varrock' || a[0] === 'exchange') return 'loc';
    if (a[0] !== 'play') return null;
    const c = CARDS[a[1]];
    switch (c.kind) {
      case 'weapon': case 'thrown': case 'bow': case 'staff': return 'weapon';
      case 'shield': return 'shield';
      case 'armor': return 'armor';
      case 'arrows': return 'ammo';
      case 'buff': return 'prayer';
      case 'material': case 'pouch': return 'mats';
      case 'quest': return 'quest';
      case 'location': case 'teleport': return 'loc';
      case 'food': return 'mydeck';                 // discards go back under your deck
      case 'npc': return 'mydiscard';               // it recovers from your discard
      case 'hammer': return a[2] === 'shield' ? 'shield' : 'weapon';
      case 'destroy': return a[2] ? `oppmat:${a[2]}` : 'opp';
      case 'spell': return c.damage || c.wears ? 'opp' : 'mymat';
      default: return 'opp';                        // abilities, Rapid, Longrange: at the bot
    }
  }
  const drag = { st: null, eatClick: false };
  const toStage = (cx, cy) => ({ x: (cx - scale.x) / scale.s, y: (cy - scale.y) / scale.s });
  function dragZones(kind, name) {
    const m = new Map();
    const add = (z, o) => { if (!m.has(z)) m.set(z, []); m.get(z).push(o); };
    if (kind === 'play') {
      const all = ui.pending.legal.map((a, j) => [a, j]).filter(([a]) => ['play', 'varrock', 'exchange'].includes(a[0]) && a[1] === name);
      const plays = all.filter(([a]) => a[0] === 'play');
      if (plays.length) m.set('mymat', plays);             // your play area: every way to play it (one resolves, several ask)
      for (const o of all) { const z = zoneFor(o[0]); if (z && z !== 'mymat') add(z, o); }   // exact spots stay as shortcuts
    }
    if (kind === 'react') add('react', null);
    if (kind === 'toss') add('mydiscard', null);

  }
  function zoneAt(cx, cy, zones) {

    if (zones.has('mymat') && toStage(cx, cy).y < SH() - 262) return 'mymat';   // anywhere on the table above your hand counts as playing it
    return null;
  }
  const tick = '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4" fill="none" stroke="#79c25a" stroke-width="2.6"/></svg>';
  function needChips(name) {                     // what the card needs, all met, shown as ticked chips under it
    const c = CARDS[name];

  function hotLabel(d, z) {

  // ---------- redrawing the duel in place ----------
  // A duel re-renders many times a turn. Rebuilding the whole board each time makes phones throw away the
  // tilted table's layers and images and paint them again, which shows as the board blinking. So the new
  // HTML is laid over the old: elements that are still there are kept and only their differences are
  // written; cards and slots are matched by what they are (id, data-at, data-bh, data-zoom), the rest by
  // position. The result is the same DOM that innerHTML would give.
  const tplEl = document.createElement('template');
  function morphInto(el, html) {
    tplEl.innerHTML = html;

  }
  function morphKey(n, seen) {
    if (n.nodeType !== 1) return null;
    const k = n.id ? '#' + n.id : n.getAttribute('data-at') || (n.hasAttribute('data-bh') ? 'bh' + n.getAttribute('data-bh') : null)
      || (n.hasAttribute('data-zoom') ? 'z:' + n.getAttribute('data-zoom') : null);
    if (!k) return null;
    const c = (seen.get(k) || 0) + 1;                 // the second Mithril Bar in a hand is its own card
    seen.set(k, c);
    return `${n.nodeName}|${k}|${c}`;
  }
  function morphKids(from, to) {
    const keyed = new Map(), seenA = new Map(), seenB = new Map(), keyOf = new Map();
    for (let c = from.firstChild; c; c = c.nextSibling) { const k = morphKey(c, seenA); if (k) { keyed.set(k, c); keyOf.set(c, k); } }
    let cur = from.firstChild;
